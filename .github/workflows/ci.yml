# Tests on Linux, Windows and macOS for every supported Python, then builds, checks and smoke-tests the wheel.
#
# A private repository pays for its minutes, Windows at twice Linux's rate and macOS at ten times; one run of the full
# matrix measured 126 billed minutes, 100 of them on macOS. So on a private repository every push tests Linux on every
# Python and Windows on the oldest and the newest (about 14 minutes), and the rest of the matrix runs for a tag or a
# run by hand. A public repository's minutes are free, and it runs the full matrix on every push.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run the tests (headless by design)
        run: python -m pytest -q

  test-full:
    # The rest of the matrix: every push on a public repository; on a private one, a tag or a run by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
      - name: Run the tests (headless by design)
        run: python -m pytest -q

  package:
    name: Build, check and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/semantext --version
          /tmp/clean/bin/semantext --help
          /tmp/clean/bin/python -m semantext --help
          /tmp/clean/bin/python -c "import importlib.metadata as m; print('semantext', m.version('semantext'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
