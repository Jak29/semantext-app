# Tests on Linux, Windows and macOS for every supported Python, then builds, checks and smoke-tests the wheel.
#
# A private repository pays for its minutes, Windows at twice Linux's rate and macOS at ten times; one run of the full
# matrix measured 126 billed minutes, 100 of them on macOS. So on a private repository every push tests Linux on every
# Python and Windows on the oldest and the newest, and the rest of the matrix runs for a tag or a
# run by hand. A public repository's minutes are free, and it runs the full matrix on every push.
#
# Every test must pass on every system, but for the few that carry the `timing` mark: tests whose time bound a hosted
# runner has missed while the project's own machine meets it (they are listed, with what was measured, in
# tests/test_ci_runs_every_test.py). A hosted runner's speed is nobody's to control: in the two runs of 1.8.0, jobs of
# the same system and the same Python met those bounds on one runner and missed them on another. So those tests run
# in a step of their own, where a miss is REPORTED and does not fail the run. The whole suite, those tests among
# them, is run on the project's own machine, where their bounds were measured, before a release.
# A job has 60 minutes: with 1.8.0's tests the suite takes about 22 minutes on a hosted Linux runner, and the hosted
# Windows runners were stopped at the old limit of 25 between 68% and 97% of the way.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: a test compares the closures with 1.3.0's own (v1.3.0)
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and what its tests need
        # The `test` extra, not pytest alone: a test file that skips itself for want of a package (the proxy's tests
        # use the Anthropic SDK as their client) would look passed here. tests/test_ci_runs_every_test.py keeps this.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run the tests (headless by design)
        run: python -m pytest -q -m "not timing"
      - name: Run the tests whose time bounds a hosted runner misses (reported, not required)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m pytest -q -m timing

  test-full:
    # The rest of the matrix: every push on a public repository; on a private one, a tag or a run by hand.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history and its tags: a test compares the closures with 1.3.0's own (v1.3.0)
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the package and what its tests need
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run the tests (headless by design)
        run: python -m pytest -q -m "not timing"
      - name: Run the tests whose time bounds a hosted runner misses (reported, not required)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m pytest -q -m timing

  package:
    name: Build, check and install the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel into a clean venv and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/semantext --version
          /tmp/clean/bin/semantext --help
          /tmp/clean/bin/python -m semantext --help
          /tmp/clean/bin/python -c "import importlib.metadata as m; print('semantext', m.version('semantext'))"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
