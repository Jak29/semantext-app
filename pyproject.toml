[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantext"
version = "1.2.2"
description = "Keep your standing rules for how an AI assistant reads you, and hand them to it with every prompt."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jak" }]
keywords = ["ai", "llm", "assistant", "claude-code", "hooks", "prompts", "rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
semantext = "semantext.cli:main"

[project.urls]
Homepage = "https://github.com/Jak29/semantext-app"
Issues = "https://github.com/Jak29/semantext-app/issues"

[tool.setuptools]
packages = ["semantext", "semantext.sources"]

[tool.setuptools.package-data]
semantext = ["static/*.html", "data/profiles/*/SEMANTICS.yaml", "data/suggestions/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
