[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantext"
version = "1.8.1"
description = "Keep your standing rules for how an AI assistant reads you, and hand them to it with every prompt."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jak" }]
keywords = ["ai", "llm", "assistant", "claude-code", "hooks", "prompts", "rules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
# What the tests need beyond the package. The proxy's tests drive it with the Anthropic SDK as their client, and skip
# themselves where it is not installed; CI installs this extra, so that they run there (tests/test_ci_runs_every_test.py).
# tomli is the TOML reader for Python 3.10, which has none of its own.
test = ["pytest>=7", "anthropic>=0.114", "tomli>=2; python_version < '3.11'"]

[project.scripts]
semantext = "semantext.cli:main"

[project.urls]
Homepage = "https://github.com/Jak29/semantext-app"
Issues = "https://github.com/Jak29/semantext-app/issues"

[tool.setuptools]
packages = ["semantext", "semantext.sources", "semantext.sources.gates", "semantext.work"]

[tool.setuptools.package-data]
semantext = ["static/v2/*", "data/profiles/*/SEMANTICS.yaml", "data/suggestions/*.yaml",
             "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `timing` marks the few tests whose time bound a hosted CI runner has missed while the project's own machine meets
# it. They are listed, with what was measured, in tests/test_ci_runs_every_test.py, which refuses the mark on any
# other test. CI runs every other test on every system, where each must pass, and these in a step of their own,
# where a miss is reported and does not fail the run. `python -m pytest` runs every test, these among them, and the
# whole suite is run on the project's own machine before a release.
markers = ["timing: a time bound a hosted CI runner has missed (CI reports it; the whole suite runs it before a release)"]
