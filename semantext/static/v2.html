  if (!rows.length) {
    place.replaceChildren(head, h("p", { class: "empty" }, "No projects yet. Name a root of kind “repo” in your seats file, and it shows here."));
    return;
  }
  const table = h("div", { class: "rows", role: "table", "aria-label": "Projects" },
    h("div", { class: "prow head-row", role: "row" }, ["Project", "Agents", "Gates, at their worst", "Waiting", "Documents"].map((t) => h("span", { class: "label", role: "columnheader" }, t))));
  for (const p of rows) {
    table.append(h("div", { class: "prow", role: "row" },
      h("div", { class: "pname", role: "cell" }, h("a", { href: "#projects/" + encodeURIComponent(p.id), "data-k": "p:" + p.id }, p.name),
        h("div", { class: "ppath", title: p.path }, tail(p.path))),
      h("div", { class: "chips", role: "cell" }, p.agents.length ? p.agents.map((a) => agentChip(a.name, a.agent_id, "pa:" + p.id + ":" + a.agent_id)) : h("span", { class: "none" }, "nobody listed")),
      h("div", { role: "cell" }, gateCell(p, "pg:" + p.id)),
      h("div", { role: "cell", class: "cellbtn" }, p.waiting.length ? h("span", { class: "goldtext" }, h("span", { class: "dot", "aria-hidden": "true" }), p.waiting.length + " waiting")
        : h("span", { class: "none", title: "Nothing waits here" }, "–"), p.cards.length ? h("span", { class: "meta" }, plural(p.cards.length, "card") + " in all") : null),
      h("div", { role: "cell" }, p.documents.length ? h("button", { class: "link", type: "button", "data-k": "pd:" + p.id,
        on: { click: (ev) => openDrawer("docs", { project: p.id }, ev.currentTarget) } }, plural(p.documents.length, "document"))
        : h("span", { class: "none", title: "No documents" }, "–"))));
  }
  place.replaceChildren(head, table);
}

function worktreeDetail(t) {
  const out = [];
  if (t.status === "missing") out.push(h("p", null, t.note || "The worktree's folder is gone."));
  if (t.status === "unknown") out.push(h("p", null, "No verdict: the reader could not be sure of git's settings here (see below)."));
  if (t.events.length) {
    out.push(h("table", { class: "events" },
      h("thead", null, h("tr", null, ["Act", "State", "Hook", "Note"].map((x) => h("th", null, x)))),
      h("tbody", null, t.events.map((e) => h("tr", null,
        h("td", null, e.event),
        h("td", { class: e.state === "open" ? "bad" : null }, e.state + " (read)"),
        h("td", { class: "mono" }, e.by || (e.needs ? "needs " + e.needs.join(" or ") : "")),
        h("td", { class: "soft" }, e.note || ""))))));
  }
  const hp = t.hooks_path;
  if (hp && hp.set) {
    out.push(h("p", null, "core.hooksPath is ", h("span", { class: "mono" }, hp.value), ", set in the " + (hp.scope || "unknown") + " settings: ",
      h("span", { class: "mono" }, (hp.file || "") + (hp.line ? " line " + hp.line : "")),
      hp.via && hp.via.length ? " (included by " + hp.via.join(", ") + ")" : "", "."));
  } else if (t.status === "read") {
    out.push(h("p", null, "core.hooksPath is not set, so git runs hooks from ", h("span", { class: "mono" }, t.hooks_dir || "its own hooks folder"), "."));
  }
  if (hp && hp.set && t.hooks_dir) out.push(h("p", { class: "soft" }, "Hooks run from ", h("span", { class: "mono" }, t.hooks_dir), "."));
  if (t.identity) {
    out.push(h("p", { class: t.identity.present && t.identity.entries ? "soft" : "bad" }, t.identity.present
      ? ".identity names " + plural(t.identity.entries, "committer") + (t.identity.entries ? "." : ", so a hook that checks it lets every commit through.")
      : "No .identity file here, so a hook that checks it lets every commit through.",
      " ", h("span", { class: "mono" }, t.identity.file || "")));
  }
  for (const s of t.stranded || []) {
    out.push(h("p", { class: "bad" }, "Stranded (read): " + s.name + " exists in " + (s.where || []).join(", ") + ", where git does not look."));
  }
  if (t.uncertain && t.uncertain.length) {
    out.push(h("div", null, h("p", { class: "label" }, "Not certain"), h("ul", { class: "soft" }, t.uncertain.map((u) => h("li", null, u)))));
  }
  if (t.files && t.files.length) {
    const d = disclosure("files:" + t.path, plural(t.files.length, "settings file") + " read");
    d.append(h("ul", { class: "mono" }, t.files.map((f) => h("li", null, f.scope + ": " + f.file + (f.included_by ? " (included by " + f.included_by + ")" : "")))));
    out.push(d);
  }
  return out;
}

function stateWords(t) {
  return h("span", { class: "words-row" }, t.words.map((w) => h("span", { class: BROKEN.has(w) ? "bad" : "soft" }, w + " (read)")));
}

// A document's address in the page: its folder (which opens its MASTER.md), or one file in it.
function docHref(id, file) { return "#documents/" + encodeURIComponent(id) + (file ? "/" + encodeURIComponent(file) : ""); }

function docNode(d) {
  const go = () => closeDrawer(true);
  return h("div", { class: "doc" },
    h("p", { class: "subject" }, h("a", { href: docHref(d.id), on: { click: go } }, d.title || d.slug)),
    h("p", { class: "meta" }, (d.agent ? d.agent + " · " : "") + "cv/" + d.slug + " · updated " + when(d.updated)),
    d.docs.length ? h("ul", null, d.docs.map((x) => h("li", null, h("a", { href: docHref(d.id, x.file), on: { click: go } }, x.title || x.file),
      h("span", { class: "meta" }, " · " + x.file + " · " + when(x.updated))))) : null,
    d.diagrams.length ? h("p", { class: "meta" }, plural(d.diagrams.length, "diagram") + ": ",
      d.diagrams.map((f, i) => [i ? ", " : "", h("a", { href: docHref(d.id, f), on: { click: go } }, f)])) : null);
}

function fillProject(data, id) {
  const place = $("place");
  const p = data.projects.find((x) => x.id === id);
  const trail = crumbs(h("a", { href: "#projects" }, "Projects"), p ? p.name : id);
  if (!p) {
    place.replaceChildren(header("No such project", "No project in your seats file has this id now.", null, trail));
    return;
  }
  const agents = h("section", { class: "part" }, h("h2", { class: "label" }, "Agents"));
  if (p.agents.length) {
    agents.append(h("div", { class: "alist" }, p.agents.map((a) => h("div", { class: "arow" }, agentChip(a.name, a.agent_id, "pp:" + a.agent_id), h("span", { class: "soft" }, basisWords(a))))));
  } else agents.append(h("p", { class: "empty" }, "Nobody is listed. Add “Name <email>” lines to this project's .identity file."));
  if (p.others && p.others.length) agents.append(h("p", { class: "meta", style: "margin-top:10px" }, "Also listed in .identity, and no agent of yours: " + listWords(p.others.map((o) => o.name)) + "."));

  const gates = h("section", { class: "part" }, h("h2", { class: "label" }, "Gates"));
  if (!p.gates.found) gates.append(h("p", { class: "empty" }, "No gate was read: the folder is not a repository the reader could find."));
  else {
    if (data.read_note) gates.append(h("p", { class: "meta", style: "margin-bottom:10px" }, "From " + data.read_note + "."));
    const list = h("div", { class: "wts" });
    for (const t of p.gates.worktrees) {
      const d = disclosure("wt:" + t.path, h("span", { style: "display:contents" }, h("span", { class: "mono", title: t.path }, wtName(t)), stateWords(t)), "wt");
      d.append(h("div", { class: "wt-body" }, worktreeDetail(t)));
      list.append(d);
    }
    gates.append(p.gates.worktrees.length ? list : h("p", { class: "empty" }, "No worktree found."));
  }

  const cardsPart = h("section", { class: "part" }, h("h2", { class: "label" }, "Cards"));
  const mine = p.cards.map((k) => data.cards[k]).filter(Boolean);
  const order = { waiting: 0, parked: 1, closed: 2, run: 2 };
  const sorted = newestFirst(mine).sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));
  cardsPart.append(sorted.length ? h("div", { class: "cards" }, sorted.map(cardNode))
    : h("p", { class: "empty" }, "No card is placed in this project. A card belongs here when it runs in this folder or names it."));

  const docsPart = h("section", { class: "part" }, h("h2", { class: "label" }, "Documents"));
  const docs = data.documents.filter((d) => d.project === p.id);
  docsPart.append(docs.length ? h("div", null, docs.map(docNode))
    : h("p", { class: "empty" }, "No documents. A folder cv/<project>/ holding a MASTER.md in an agent's home shows here."));

  const sub = p.home_of && p.home_of.length ? "The home of " + listWords(p.home_of) + "." : plural(p.agents.length, "agent") + " work here.";
  place.replaceChildren(header(p.name, sub, p.path, trail), agents, gates, cardsPart, docsPart);
}

// A worktree by the name a person knows it by: the main one, or its folder within the project.
function wtName(t) { return t.main ? "main worktree" : t.short; }

// ---------------------------------------------------------------- Documents
// Every project folder an agent keeps in its cv/ with a MASTER.md, as your inbox's Documents lists them, read here:
// MASTER.md (with its Copy button), the detailed documents beside it, and its diagrams. The server reads only a file its
// documents reader lists in a listed folder; this page sets every word of it as text.
const D = { text: new Map(), images: new Map(), pending: new Set() };

async function readDocument(id, file) {
  const r = await fetch("/api/v2/document?doc=" + encodeURIComponent(id) + "&file=" + encodeURIComponent(file),
    { headers: { "X-Semantext": "1" }, cache: "no-store" });
  if (!r.ok) {
    let why = "the server answered " + r.status;
    try { why = (await r.json()).error || why; } catch (e) { /* the status says enough */ }
    throw new Error(why);
  }
  return r;
}

// A file's text, read once for each time its folder was updated: {text} or {error}, or null while it is read (the place
// is drawn again when it arrives).
function docText(d, file) {
  const key = d.id + "/" + file + "@" + d.updated;
  if (D.text.has(key)) return D.text.get(key);
  if (!D.pending.has(key)) {
    D.pending.add(key);
    readDocument(d.id, file).then((r) => r.json()).then((j) => ({ text: String(j.text || "") }), (e) => ({ error: String(e.message || e) }))
      .then((v) => { D.text.set(key, v); D.pending.delete(key); if (S.place === "documents") fill(); });
  }
  return null;
}

// A diagram, shown through an <img>, which never runs a diagram's script. Its bytes come from the read route (with the
// page's header, which an <img> cannot send), so the <img> is given them as a local object URL.
function diagramNode(d, file, alt) {
  const fig = h("figure", { class: "md-figure" });
  const key = d.id + "/" + file + "@" + d.updated;
  const got = D.images.get(key);
  if (got && got.url) fig.append(h("img", { src: got.url, alt: alt || file }));
  else if (got) fig.append(h("p", { class: "refused" }, "Could not read " + file + ": " + got.error));
  else {
    fig.append(h("p", { class: "meta" }, "Reading " + file + "…"));
    if (!D.pending.has(key)) {
      D.pending.add(key);
      readDocument(d.id, file).then((r) => r.arrayBuffer())
        .then((buf) => ({ url: URL.createObjectURL(new Blob([buf], { type: "image/svg+xml" })) }), (e) => ({ error: String(e.message || e) }))
        .then((v) => { D.images.set(key, v); D.pending.delete(key); if (S.place === "documents") fill(); });
    }
  }
  if (alt) fig.append(h("figcaption", { class: "meta" }, alt));
  return fig;
}

// ---- markdown, read safely: headings, paragraphs, lists, quotes, code, tables, bold, italics, inline code, links and
// diagrams. Every node is built from text, so HTML written in a document shows as the text it is.
const MD_ITEM = /^\s*([-*]|\d+[.)])\s+/;
const MD_INLINE = /(`[^`]+`)|(!\[[^\]]*\]\([^)\s]+\))|(\[[^\]]+\]\([^)\s]+\))|(\*\*[^*]+\*\*)|(\*[^*\s][^*]*\*)/g;

function renderMarkdown(text, ctx) {
  const out = document.createDocumentFragment();
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^```/.test(line)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.append(h("pre", null, h("code", null, buf.join("\n"))));
      continue;
    }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      const head = document.createElement("h" + Math.min(m[1].length + 1, 6));
      mdInline(head, m[2], ctx);
      out.append(head);
      i++;
      continue;
    }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.append(document.createElement("hr")); i++; continue; }
    if (/^>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      const quote = document.createElement("blockquote");
      quote.append(renderMarkdown(buf.join("\n"), ctx));
      out.append(quote);
      continue;
    }
    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|?\s*:?-{3,}/.test(lines[i + 1])) {
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      out.append(mdTable(rows, ctx));
      continue;
    }
    if (MD_ITEM.test(line)) {
      const list = document.createElement(/^\s*\d+[.)]\s+/.test(line) ? "ol" : "ul");
      while (i < lines.length && MD_ITEM.test(lines[i])) {
        let item = lines[i++].replace(MD_ITEM, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !MD_ITEM.test(lines[i])) item += " " + lines[i++].trim();
        const li = document.createElement("li");
        mdInline(li, item, ctx);
        list.append(li);
      }
      out.append(list);
      continue;
    }
    const buf = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6}\s|```|>|\|)/.test(lines[i]) && !MD_ITEM.test(lines[i])) buf.push(lines[i++].trim());
    if (!buf.length) buf.push(lines[i++].trim());
    const para = document.createElement("p");
    mdInline(para, buf.join(" "), ctx);
    out.append(para);
  }
  return out;
}

function mdInline(parent, text, ctx) {
  let last = 0;
  for (const m of text.matchAll(MD_INLINE)) {
    if (m.index > last) parent.append(document.createTextNode(text.slice(last, m.index)));
    const token = m[0];
    if (m[1]) parent.append(h("code", null, token.slice(1, -1)));
    else if (m[2]) {
      const parts = token.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/);
      parent.append(mdDiagram(parts[1], parts[2], ctx));
    } else if (m[3]) {
      const parts = token.match(/^\[([^\]]+)\]\(([^)\s]+)\)$/);
      parent.append(mdLink(parts[1], parts[2], ctx));
    } else if (m[4]) {
      const strong = document.createElement("strong");
      mdInline(strong, token.slice(2, -2), ctx);
      parent.append(strong);
    } else if (m[5]) {
      const em = document.createElement("em");
      mdInline(em, token.slice(1, -1), ctx);
      parent.append(em);
    }
    last = m.index + token.length;
  }
  if (last < text.length) parent.append(document.createTextNode(text.slice(last)));
}

// A link to https opens in a new tab, with no way back to this page; a relative .md link that names a document of the
// same folder opens it here; anything else is plain text, its address beside it.
function mdLink(text, href, ctx) {
  if (/^https:\/\/[^\s]+$/i.test(href)) return h("a", { href, target: "_blank", rel: "noopener noreferrer" }, text);
  const d = ctx && ctx.doc;
  if (d && /^[^\/\\:?#]+\.md$/i.test(href)) {
    if (d.master && href.toLowerCase() === d.master.toLowerCase()) return h("a", { href: docHref(d.id) }, text);
    if ((d.docs || []).some((x) => x.file === href)) return h("a", { href: docHref(d.id, href) }, text);
  }
  return document.createTextNode(text + " (" + href + ")");
}

function mdDiagram(alt, src, ctx) {
  const d = ctx && ctx.doc;
  if (d && /^[^\/\\:?#]+\.svg$/i.test(src) && (d.diagrams || []).includes(src)) return diagramNode(d, src, alt);
  return h("figure", { class: "md-figure" }, h("figcaption", { class: "meta" }, "[diagram: " + (alt || src) + "]"));
}

function mdTable(rows, ctx) {
  const cells = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  const cell = (tag, c) => { const n = document.createElement(tag); mdInline(n, c, ctx); return n; };
  return h("div", { class: "md-table-wrap" }, h("table", null,
    h("thead", null, h("tr", null, cells(rows[0]).map((c) => cell("th", c)))),
    h("tbody", null, rows.slice(2).map((row) => h("tr", null, cells(row).map((c) => cell("td", c)))))));
}

// Copy MASTER.md's text, as your inbox's Copy does; when the clipboard is refused, the text is shown selected.
async function copyText(button, text, into) {
  const label = button.textContent;
  try {
    await navigator.clipboard.writeText(text);
    button.textContent = "Copied";
  } catch (e) {
    let box = into.querySelector("textarea.copy-box");
    if (!box) { box = h("textarea", { class: "copy-box", readonly: true, "aria-label": "MASTER.md, selected to copy" }); box.value = text; into.append(box); }
    box.focus();
    box.select();
    button.textContent = "Press Ctrl+C";
  }
  setTimeout(() => { button.textContent = label; }, 1800);
}

function fillDocuments() {
  const data = S.data.documents;
  const place = $("place");
  if (!data) {
    place.replaceChildren(header("Documents", S.err ? "The page could not read your documents: " + S.err + ". A server started before the page changed reads them once it is started again."
      : "Reading your files…"));
    return;
  }
  if (data.off) {
    place.replaceChildren(header("Documents", "Documents are off: your sources file names no seats file.", S.frame ? "Your sources file: " + S.frame.config : null));
    return;
  }
  const docs = data.documents || [];
  if (S.sub) {
    const cut = S.sub.indexOf("/");
    const id = cut < 0 ? S.sub : S.sub.slice(0, cut);
    return fillDocument(docs.find((d) => d.id === id), id, cut < 0 ? null : S.sub.slice(cut + 1) || null);
  }
  const head = header("Documents", docs.length ? plural(docs.length, "project") + " with a MASTER.md, newest first. Each agent keeps its projects' documents in its own cv folder."
    : "No project documents yet. A folder cv/<project>/ holding a MASTER.md in an agent's home shows here.");
  place.replaceChildren(head, h("div", { class: "docrows" }, docs.map((d) => h("a", { class: "docrow", href: docHref(d.id), "data-k": "doc:" + d.id },
    h("span", { class: "card-head" }, chip(d.agent, "seat"), d.project_name ? chip(d.project_name, "kind") : null, h("span", { class: "at" }, "Updated " + when(d.updated))),
    h("span", { class: "subject" }, d.title || d.slug),
    h("span", { class: "meta" }, plural(d.docs.length, "detailed document") + " · " + plural(d.diagrams.length, "diagram") + " · cv/" + d.slug)))));
}

function fillDocument(d, id, file) {
  const place = $("place");
  const all = h("a", { href: "#documents" }, "Documents");
  if (!d) { place.replaceChildren(header("No such document", "No document of yours has this id now.", null, crumbs(all, id))); return; }
  const isMaster = !file || file === d.master;
  const name = isMaster ? d.master : file;
  const sub = isMaster ? null : (d.docs || []).find((x) => x.file === file);
  const diagram = !isMaster && (d.diagrams || []).includes(file);
  const title = isMaster ? (d.title || d.slug) : sub ? (sub.title || file) : file;
  const trail = isMaster ? crumbs(all, d.title || d.slug) : crumbs(all, h("a", { href: docHref(d.id) }, d.title || d.slug), title);
  const meta = d.agent + "'s project" + (d.project_name ? " · " + d.project_name : "") + " · cv/" + d.slug + "/" + name + " · updated " + when(isMaster ? d.updated : sub ? sub.updated : d.updated);
  const parts = [header(title, null, meta, trail)];
  if (!isMaster && !sub && !diagram) {
    parts.push(h("p", { class: "empty" }, "This file is not one listed in " + (d.title || d.slug) + "'s folder."));
    place.replaceChildren(...parts);
    return;
  }
  const art = h("article", { class: "md" });
  if (diagram) art.append(diagramNode(d, file, null));
  else {
    const got = docText(d, name);
    if (!got) art.append(h("p", { class: "meta" }, "Reading " + name + "…"));
    else if (got.error) art.append(h("p", { class: "refused" }, "Could not read " + name + ": " + got.error));
    else art.append(renderMarkdown(got.text, { doc: d }));
    if (isMaster) {
      const copy = h("button", { type: "button", "data-k": "copy:" + d.id, disabled: !(got && !got.error) }, "Copy MASTER.md");
      const tools = h("div", { class: "doc-tools" }, copy);
      if (got && !got.error) copy.addEventListener("click", () => copyText(copy, got.text, tools));
      parts.push(tools);
    }
  }
  parts.push(art);
  if (isMaster && (d.docs.length || d.diagrams.length)) {
    const more = h("section", { class: "part" });
    if (d.docs.length) more.append(h("h2", { class: "label" }, "Detailed documents"), h("div", { class: "alist" }, d.docs.map((x) => h("div", { class: "arow" },
      h("a", { href: docHref(d.id, x.file), "data-k": "docf:" + d.id + ":" + x.file }, x.title || x.file), h("span", { class: "meta" }, x.file + " · " + when(x.updated))))));
    if (d.diagrams.length) more.append(h("h2", { class: "label", style: d.docs.length ? "margin-top:20px" : null }, "Diagrams"), h("div", { class: "alist" }, d.diagrams.map((f) => h("div", { class: "arow" },
      h("a", { href: docHref(d.id, f), "data-k": "docf:" + d.id + ":" + f }, f)))));
    parts.push(more);
  }
  place.replaceChildren(...parts);
}

// ---------------------------------------------------------------- the map of the whole
const TILE_LIMIT = 14;   // at most 14 named children on a level

function brokenWords(words) {
  const say = { "off": ["off", "off"], "checks nothing": ["checks nothing", "check nothing"], "open": ["open", "open"], "stranded": ["stranded", "stranded"] };
  return Object.entries(words || {}).sort((a, b) => b[1] - a[1]).map(([w, n]) => n + " " + (say[w] ? say[w][n === 1 ? 0 : 1] : w)).join(", ");
}

function marks(n, below) {
  const out = [];
  if (n.waiting) out.push(h("span", { class: "marks" }, h("span", { class: "dot", "aria-hidden": "true" }), plural(n.waiting, "card") + " waiting"));
  if (n.broken) out.push(h("span", { class: "marks bad" }, h("span", { class: "mark", "aria-hidden": "true" }),
    plural(n.broken, "worktree") + (below ? " below" : "") + ": " + brokenWords(n.broken_words) + " (read)"));
  if (!n.waiting && !n.broken) out.push(h("span", { class: "marks quiet" }, "nothing waiting; no gate found broken (read)"));
  return out;
}

function tilesOf(items, make) {
  const shown = items.slice(0, TILE_LIMIT).map(make);
  const out = [h("div", { class: "tiles" }, shown)];
  if (items.length > TILE_LIMIT) {
    const d = disclosure("more:" + S.sub, plural(items.length - TILE_LIMIT, "more"));
    d.append(h("div", { class: "tiles", style: "margin-top:12px" }, items.slice(TILE_LIMIT).map(make)));
    out.push(d);
  }
  return out;
}

function nodeTile(data, n) {
  const kind = n.kind === "group" ? "group · " + plural(n.children.length, "environment")
    : n.kind === "environment" ? "home of " + listWords(n.members.map((m) => m.name)) + " · " + plural(n.projects.length, "project")
    : n.kind;
  return h("a", { class: "tile", href: "#" + mapKey() + "/" + encodeURIComponent(n.id), "data-k": "node:" + n.id },
    h("span", { class: "name" }, n.name || "(no name)"), h("span", { class: "kind" }, kind), marks(n, true));
}

function projectTile(t, home) {
  return h("a", { class: "tile", href: "#projects/" + encodeURIComponent(t.id), "data-k": "pt:" + t.id },
    h("span", { class: "name" }, t.name), h("span", { class: "kind" }, (home ? "its home · " : "project · ") + plural(t.worktrees, "worktree")),
    marks(t, false));
}

function agentTile(data, m) {
  const a = data.agents[m.agent_id] || { name: m.name, waiting: [], works: [] };
  const n = { waiting: a.waiting.length, broken: 0 };
  return h("button", { class: "tile", type: "button", "data-k": "at:" + m.agent_id, on: { click: (ev) => openDrawer("agent", { id: m.agent_id }, ev.currentTarget) } },
    h("span", { class: "name" }, a.name), h("span", { class: "kind" }, "agent · works in " + plural(a.works.length, "project")),
    n.waiting ? h("span", { class: "marks" }, h("span", { class: "dot", "aria-hidden": "true" }), plural(n.waiting, "card") + " waiting") : h("span", { class: "marks quiet" }, "nothing waiting"));
}

function fillMap() {
  const data = S.data.map;
  const place = $("place");
  const word = (S.frame && S.frame.name) || "Map";
  if (!data) { place.replaceChildren(header(word, "Reading your files…")); return; }
  if (data.off || !data.root) {
    place.replaceChildren(header(word, "The map is off: your sources file names no seats file and no map.", S.frame ? "Your sources file: " + S.frame.config : null));
    return;
  }
  const node = data.nodes[S.sub] || data.nodes[data.root];
  const chain = [];
  for (let n = node; n; n = n.parent ? data.nodes[n.parent] : null) chain.unshift(n);
  const trail = chain.length > 1 ? crumbs(...chain.slice(0, -1).map((n) => h("a", { href: "#" + mapKey() + "/" + encodeURIComponent(n.id) },
    n.kind === "whole" ? word : n.name)), node.name) : null;
  const legend = h("p", { class: "meta legend" }, h("span", { class: "dot", "aria-hidden": "true" }), "a card waits for your word below",
    h("span", { class: "mark", "aria-hidden": "true", style: "margin-left:18px" }), "a gate below is off, open, stranded or checks nothing, from a static read");
  const parts = [];
  if (node.kind === "whole") {
    const m = data.map || {};
    let line = "No map file is named in your sources file.";
    if (m.off === false) {
      line = m.places == null ? "The map file could not be summed up (see the problems above)."
        : "The map: " + plural(m.places, "place") + " and " + plural(m.edges || 0, "edge") + (m.measured ? ", measured " + day(m.measured) : ", with no date of measuring") + ".";
    }
    parts.push(header(word, line, null, trail));
    if (m.sectors && m.sectors.length) {
      const d = disclosure("map:sectors", plural(m.sectors.length, "sector") + " in the map file");
      d.append(h("ul", { class: "sectors" }, m.sectors.map((s) => h("li", null, h("span", null, s.name), h("span", { class: "meta" }, " · " + plural(s.places || 0, "place") + (s.title ? " · " + s.title : ""))))));
      parts[0].append(h("div", { style: "margin-top:8px" }, d));
    }
    const kids = node.children.map((id) => data.nodes[id]).filter(Boolean);
    // A level shows only when it has two: one group alone is opened in place, under its name.
    if (kids.length === 1 && kids[0].kind === "group") {
      const g = kids[0];
      const gk = g.children.map((id) => data.nodes[id]).filter(Boolean);
      parts.push(h("section", { class: "part" },
        h("h2", { class: "label" }, h("a", { href: "#" + mapKey() + "/" + encodeURIComponent(g.id), style: "color:inherit" }, g.name), " · " + plural(gk.length, "environment")),
        tilesOf(gk, (n) => nodeTile(data, n))));
    } else {
      parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "In it"), tilesOf(kids, (n) => nodeTile(data, n))));
    }
  } else if (node.kind === "group") {
    parts.push(header(node.name, "A group of " + plural(node.members.length, "agent") + ", in " + plural(node.children.length, "environment") + ".", null, trail));
    const kids = node.children.map((id) => data.nodes[id]).filter(Boolean);
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Environments"), tilesOf(kids, (n) => nodeTile(data, n))));
    const homeless = node.members.filter((m) => !kids.some((k) => k.members.some((x) => x.agent_id === m.agent_id)));
    if (homeless.length) parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Agents with no home folder"), tilesOf(homeless, (m) => agentTile(data, m))));
  } else {
    parts.push(header(node.name, "An environment: " + listWords(node.members.map((m) => m.name + "'s home")) + ".", node.path, trail));
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Members"), tilesOf(node.members, (m) => agentTile(data, m))));
    const tiles = node.projects.map((id) => data.projects[id]).filter(Boolean);
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Works in"),
      tiles.length ? tilesOf(tiles, (t) => projectTile(t, t.id === node.project_id)) : h("p", { class: "empty" }, "No project lists its members.")));
  }
  parts.push(legend);
  place.replaceChildren(...parts);
}

// ---------------------------------------------------------------- the Record
const R = {};

function mountRecord() {
  R.head = h("div");
  R.search = h("input", { class: "input search", type: "search", placeholder: "Search your words", "aria-label": "Search your words",
    value: S.q.record, "data-k": "search:record" });
  R.search.addEventListener("input", () => { S.q.record = R.search.value; fill(); });
  R.facets = h("div", { class: "seg", role: "group", "aria-label": "Status" });
  R.tools = h("div", { class: "tools" }, R.search, R.facets);
  R.list = h("div");
  R.empty = h("p", { class: "empty", hidden: true });
  $("place").replaceChildren(R.head, R.tools, R.list, R.empty);
}

// The Record zooms: threads by subject, then a thread's decisions, then one decision at its source (your words whole,
// the offer you accepted, and where they were first written down, as the register pins them). The register stays the
// authority; nothing here is a summary. Search reads your own words (and the offers and quotes you were given), not the
// scribe's readings.
function entryText(e) {
  return [e.id, e.subject, e.words, e.offer, ...(e.notes || []).map((n) => n.quote)].filter((x) => typeof x === "string").join("\n").toLowerCase();
}

function statusWord(s) { return h("span", { class: "state-word" + (s === "superseded" || s === "parked" ? " quiet" : "") }, s || "no status"); }

const utf8 = (s) => new TextEncoder().encode(String(s || ""));
// Words that fit in 512 bytes are shown whole. Longer words are shown up to that, cut at a character, with how much
// is left and where it is whole: never summarised.
function wordsNode(text, limit, whole) {
  const s = typeof text === "string" ? text : text === null || text === undefined ? "" : JSON.stringify(text);
  if (!s) return h("blockquote", { class: "words" }, "(no words recorded)");
  const bytes = utf8(s);
  if (bytes.length <= limit) return h("blockquote", { class: "words" }, s);
  let cut = new TextDecoder("utf-8", { fatal: false }).decode(bytes.slice(0, limit)).replace(/�+$/, "");
  return h("div", null, h("blockquote", { class: "words" }, cut + "…"),
    h("p", { class: "meta" }, (bytes.length - utf8(cut).length) + " more bytes, not shown here. ", whole ? h("a", { href: whole }, "Read them whole at the source") : null));
}

const recordHref = (id) => "#record/" + encodeURIComponent(id);
const recordLinks = (ids) => ids.map((id, i) => [i ? ", " : "", h("a", { href: recordHref(id) }, id)]);

// A decision in its thread: its id, date and status, your words (whole up to 512 bytes), and what superseded it.
function entryNode(e, limit, withSubject) {
  const node = h("div", { class: "entry", "data-entry": e.id, "data-k": "entry:" + e.id, tabindex: "-1" });
  if (withSubject) node.append(h("p", { class: "subject" }, e.subject || "(no subject)"));
  const stored = e.stored_status && e.stored_status !== e.computed_status ? " (stored as " + e.stored_status + ")" : "";
  node.append(h("p", { class: "meta" }, h("a", { class: "mono", href: recordHref(e.id), title: "Open it at its source" }, e.id), " · " + day(e.date) + " · ",
    statusWord(e.computed_status), stored + (e.to ? " · to " + e.to : "")));
  node.append(wordsNode(e.words, limit, e.id ? recordHref(e.id) : null));
  const rel = h("p", { class: "rel" });
  if (e.superseded_by && e.superseded_by.length) rel.append(h("span", { class: "bad" }, "Superseded by ", recordLinks(e.superseded_by)));
  if (e.supersedes && e.supersedes.length) rel.append(h("span", null, "Supersedes ", recordLinks(e.supersedes)));
  if (rel.childNodes.length) node.append(rel);
  return node;
}

// One decision at its source: everything the register holds for it, each labelled with whose words it is.
function sourceNode(e, byId) {
  const parts = [];
  const facts = h("dl", { class: "facts" });
  const add = (k, v, cls) => { if (v !== null && v !== undefined && v !== "") facts.append(h("dt", null, k), h("dd", { class: cls || null }, v)); };
  add("Status", [statusWord(e.computed_status), e.stored_status && e.stored_status !== e.computed_status ? " (stored as " + e.stored_status + ")" : ""]);
  add("Date", e.date ? day(e.date) + (e.time ? " · " + e.time + " UTC" : "") : null);
  add("To", e.to);
  if (e.pin) {
    add("Written down", h("span", { class: "mono" }, e.pin.repo + " at commit " + e.pin.commit + ", " + e.pin.file + ", "
      + (e.pin.last_line !== e.pin.line ? "lines " + e.pin.line + " to " + e.pin.last_line : "line " + e.pin.line)));
  } else add("Written down", e.source ? h("span", null, h("span", { class: "mono" }, String(e.source)), " (not in repo@commit:file:line form, so no line is given)") : "no source recorded");
  add("Recorded by", [e.added_by, e.added ? day(e.added) : null].filter(Boolean).join(" · "));
  parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Your words, whole"), wordsNode(e.words, Infinity, null)));
  if (e.offer) parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "The offer you accepted"), wordsNode(e.offer, Infinity, null)));
  parts.push(h("section", { class: "part" }, facts));
  if (e.computed_status === "parked") {
    parts.push(h("p", { class: "meta", style: "margin-top:12px" }, "A hold: its words are above, whole, and its time anchor is the date. The register keeps no separate field for what it stops or who lifts it; your words say it."));
  }
  const rel = h("p", { class: "rel" });
  if (e.superseded_by && e.superseded_by.length) rel.append(h("span", { class: "bad" }, "Superseded by ", recordLinks(e.superseded_by)));
  if (e.supersedes && e.supersedes.length) rel.append(h("span", null, "Supersedes ", recordLinks(e.supersedes)));
  if (rel.childNodes.length) parts.push(h("section", { class: "part" }, rel));
  for (const later of e.superseded_by || []) {
    const s = byId.get(later);
    if (s) parts.push(h("div", { class: "note" }, h("p", { class: "label" }, "Superseded by " + later + ", " + day(s.date)), wordsNode(s.words, Infinity, null)));
  }
  if (e.reading) {
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "The scribe's reading"),
      h("p", { class: "meta" }, "An agent's one-line reading of your words, not your words."), h("p", { class: "soft" }, e.reading)));
  }
  for (const n of e.notes || []) {
    parts.push(h("div", { class: "note" }, h("p", { class: "label" }, "Note (the scribe's, not a decision of yours)"), h("p", { class: "soft" }, n.text || ""),
      n.quote ? wordsNode(n.quote, Infinity, null) : null,
      h("p", { class: "pin" }, n.pin ? n.pin.repo + " at commit " + n.pin.commit + ", " + n.pin.file + ", line " + n.pin.line + (n.pin.last_line !== n.pin.line ? " to " + n.pin.last_line : "") : (n.source || ""))));
  }
  return parts;
}

function fillRecord() {
  const data = S.data.record;
  if (!data) { R.head.replaceChildren(header("Record", "Reading your files…")); return; }
  if (data.off) {
    R.head.replaceChildren(header("Record", "The record is off: your sources file names no register.", S.frame ? "Your sources file: " + S.frame.config : null));
    R.tools.hidden = true;
    R.list.replaceChildren();
    return;
  }
  R.tools.hidden = false;
  const counts = data.counts || {};
  const by = counts.by_status || {};
  R.head.replaceChildren(header("Record", plural(counts.entries || 0, "decision") + " in " + plural(counts.threads || 0, "thread") + ", newest first. Your words are kept as you gave them.",
    data.files && data.files.register ? "From " + data.files.register + (data.notes_off ? "" : ", with its notes") + "." : null));
  const facets = [["all", "All", counts.entries || 0], ...Object.entries(by).filter(([, n]) => n > 0).map(([s, n]) => [s, cap(s), n])];
  if (!facets.some(([k]) => k === S.facet)) S.facet = "all";
  R.facets.replaceChildren(...facets.map(([k, label, n]) => h("button", { type: "button", "aria-pressed": String(S.facet === k), "data-k": "facet:" + k,
    on: { click: () => { S.facet = k; fill(); } } }, label, h("span", { class: "n" }, String(n)))));
  const q = S.q.record.trim().toLowerCase();
  const byId = new Map((data.entries || []).filter((e) => typeof e.id === "string").map((e) => [e.id, e]));
  const limit = data.whole_bytes || 512;
  const all = h("a", { href: "#record" }, "Record");
  const sub = S.sub || "";
  // Level 3: one decision at its source.
  if (sub && !sub.startsWith("t/")) {
    R.tools.hidden = true;
    R.empty.hidden = true;
    const e = byId.get(sub);
    const t = e && (data.threads || []).find((x) => (x.entries || []).includes(e.id));
    if (!e) { R.head.replaceChildren(header("No such decision", "No decision in your register has the id " + sub + " now.", null, crumbs(all, sub))); R.list.replaceChildren(); return; }
    R.head.replaceChildren(header(e.id, null, null, crumbs(all, t ? h("a", { href: "#record/t/" + t.key }, t.subject || "(no subject)") : e.subject || "(no subject)", e.id)));
    R.list.replaceChildren(h("p", { class: "subject" }, e.subject || "(no subject)"), ...sourceNode(e, byId));
    return;
  }
  // Level 2: one thread's decisions, newest first.
  if (sub.startsWith("t/")) {
    R.tools.hidden = true;
    R.empty.hidden = true;
    const t = (data.threads || []).find((x) => x.key === sub.slice(2));
    if (!t) { R.head.replaceChildren(header("No such thread", "No subject in your register has this address now.", null, crumbs(all, "a thread"))); R.list.replaceChildren(); return; }
    const ents = (t.entries || []).map((id) => byId.get(id)).filter(Boolean).reverse();
    R.head.replaceChildren(header(t.subject || "(no subject)", plural((t.entries || []).length, "decision") + " · now " + (t.current || "no status")
      + ((t.to || []).length ? " · to " + t.to.join(", ") : "") + " · " + (t.first === t.last ? day(t.last) : day(t.first) + " to " + day(t.last)), null, crumbs(all, t.subject || "(no subject)")));
    R.list.replaceChildren(h("div", { class: "thread" }, ents.map((e) => entryNode(e, limit, false))));
    return;
  }
  // Level 1: the threads, one line each; with a search, the decisions whose words match, each one click from its source.
  const fits = (e) => (S.facet === "all" || e.computed_status === S.facet) && (!q || entryText(e).includes(q));
  const out = [];
  let shown = 0;
  if (q) {
    for (const t of data.threads || []) {
      for (const e of (t.entries || []).map((id) => byId.get(id)).filter((x) => x && fits(x)).reverse()) { shown++; out.push(h("div", { class: "thread" }, entryNode(e, limit, true))); }
    }
  } else {
    for (const t of data.threads || []) {
      const ents = (t.entries || []).map((id) => byId.get(id)).filter((e) => e && fits(e));
      if (!ents.length) continue;
      shown += ents.length;
      out.push(h("a", { class: "thread threadrow", href: "#record/t/" + t.key, "data-k": "thread:" + t.key },
        h("span", { class: "subject" }, t.subject || "(no subject)"),
        h("span", { class: "meta" }, plural((t.entries || []).length, "decision") + " · now " + (t.current || "no status") + ((t.to || []).length ? " · to " + t.to.join(", ") : "")
          + " · " + (t.first === t.last ? day(t.last) : day(t.first) + " to " + day(t.last)))));
    }
  }
  R.list.replaceChildren(...out);
  R.empty.hidden = shown !== 0;
  R.empty.textContent = q ? "No decision's words match “" + S.q.record.trim() + "”" + (S.facet !== "all" ? " among those " + S.facet : "") + "." : "No decision has this status.";
}

// ---------------------------------------------------------------- drawers
function openDrawer(kind, arg, opener) {
  S.drawer = { kind, arg: arg || {} };
  S.opener = opener || document.activeElement;
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  renderDrawer(true);
  $("drawer-close").focus();
  const route = DRAWER_ROUTE[kind];
  if (!S.data[route]) load(route).then(() => renderDrawer(false)).catch((e) => { S.err = String(e.message || e); renderProblems(); });
}

function closeDrawer(quiet) {
  if (!S.drawer) return;
  S.drawer = null;
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  const back = S.opener;
  S.opener = null;
  if (quiet) return;
  if (back && document.contains(back)) back.focus();
  else if (back && back.dataset && back.dataset.k) {
    const again = document.querySelector('[data-k="' + CSS.escape(back.dataset.k) + '"]');
    (again || $("main")).focus();
  } else $("main").focus();
}

function drawerPart(label, ...kids) { return h("section", { class: "part" }, h("h3", { class: "label" }, label), ...kids); }

function renderDrawer(fresh) {
  if (!S.drawer) return;
  const body = $("drawer-body");
  const y = body.scrollTop;
  const { kind, arg } = S.drawer;
  const data = S.data[DRAWER_ROUTE[kind]];
  $("drawer-kind").textContent = { agent: "Agent", rules: "Rules", gates: "Gates", docs: "Documents" }[kind];
  if (!data) { $("drawer-title").textContent = "Reading…"; body.replaceChildren(); return; }
  const parts = (DRAW[kind] || (() => ["", []]))(data, arg);
  $("drawer-title").textContent = parts[0];
  body.replaceChildren(...parts[1]);
  if (!fresh) body.scrollTop = y;
}

const DRAW = {
  agent(data, arg) {
    const id = arg.id || (data.names || {})[arg.name];
    const a = data.agents[id];
    if (!a) return [arg.name || "No such agent", [h("p", { class: "empty" }, "This agent is not in your seats file now.")]];
    const facts = h("dl", { class: "facts" });
    const add = (k, v) => { if (v) facts.append(h("dt", null, k), h("dd", null, v)); };
    add("Also called", (a.other_names || []).join(", "));
    add("Groups", (a.groups || []).join(", "));
    add("Emails", (a.emails || []).join(", "));
    if (a.home) facts.append(h("dt", null, "Home"), h("dd", { class: "mono" }, a.home));
    const go = (href) => (ev) => { closeDrawer(true); if (location.hash === href) ev.preventDefault(); };
    const works = a.works.length ? h("div", { class: "alist" }, a.works.map((w) => h("div", { class: "arow" },
      h("a", { href: "#projects/" + encodeURIComponent(w.project_id), on: { click: go("#projects/" + w.project_id) } }, w.name),
      h("span", { class: "soft" }, basisWords(w))))) : h("p", { class: "empty" }, "No project lists this agent.");
    const waiting = a.waiting.map((k) => data.cards[k]).filter(Boolean);
    const cardsList = waiting.length ? h("div", { class: "alist" }, newestFirst(waiting).map((c) => h("div", { class: "arow" },
      h("button", { class: "link mono", type: "button", on: { click: () => goCard(c.key) } }, c.id),
      h("span", null, c.title), h("span", { class: "meta" }, when(c.at)))))
      : h("p", { class: "empty" }, "Nothing from " + a.name + " waits for your word" + (a.cards ? "; " + plural(a.cards, "card") + " in all." : "."));
    const docs = (data.documents || []).filter((d) => a.documents.includes(d.id));
    const docList = docs.length ? h("div", { class: "alist" }, docs.map((d) => h("div", { class: "arow" },
      h("a", { href: docHref(d.id), on: { click: () => closeDrawer(true) } }, d.title || d.slug),
      h("span", { class: "meta" }, "cv/" + d.slug + " · " + when(d.updated)))))
      : h("p", { class: "empty" }, "No documents in " + a.name + "'s cv folder.");
    const r = a.rules || { environments: [] };
    const rules = h("div", { class: "alist" },
      h("p", { class: "soft" }, r.environments.length ? "Its own: " + r.environments.join(", ") + ". Every other environment is shared." : "No environment of its own; it reads the shared ones."),
      h("button", { class: "link", type: "button", on: { click: (ev) => openDrawer("rules", { agent: a.name }, ev.currentTarget) } }, "Open " + a.name + "'s rules"));
    return [a.name, [h("section", { class: "part" }, facts), drawerPart("Works in", works), drawerPart("Waiting", cardsList),
      drawerPart("Documents", docList), drawerPart("Rules", rules)]];
  },

  rules(data, arg) {
    if (data.off) return ["Rules", [h("p", { class: "empty" }, "Rules are off: your sources file names no folder of rule cards.")]];
    const envs = data.environments || [];
    const agent = arg.agent;
    const owned = new Set(Object.values(data.agents || {}).flatMap((x) => x.environments || []));
    let chosen = envs;
    let lead = "";
    if (agent && data.agents && data.agents[agent]) {
      const mine = data.agents[agent].environments || [];
      chosen = [...envs.filter((e) => mine.includes(e.name)), ...envs.filter((e) => !owned.has(e.name))];
      lead = (mine.length ? "Its own environment" + (mine.length > 1 ? "s" : "") + " first (" + Object.values(data.agents[agent].basis || {}).join("; ") + "), then the shared ones." : "It has no environment of its own; these are the shared ones.");
    }
    const c = data.counts || {};
    const share = (n) => c.rules ? " (" + Math.round(100 * (n || 0) / c.rules) + "%)" : "";
    const parts = [h("section", { class: "part" },
      h("p", { class: "soft" }, plural(c.rules || 0, "rule") + " in " + plural(c.environments || 0, "environment") + ": " + (c.written || 0) + " written" + share(c.written)
        + ", " + (c.checked || 0) + " checked" + share(c.checked) + ", " + (c.guarded || 0) + " guarded" + share(c.guarded) + "."),
      lead ? h("p", { class: "meta", style: "margin-top:4px" }, lead) : null,
      h("p", { class: "meta", style: "margin-top:4px" }, "How firmly each is held: written, its words alone; checked, a correction kept as a regression case names it; guarded, a checker your guards file names refuses a break, with a must-pass and a must-refuse arm."),
      data.guards ? null : h("p", { class: "meta", style: "margin-top:4px" }, "Your sources file names no guards file, so no checker is named and no rule is guarded. A guard a card only mentions is shown as its claim, and counts for nothing."))];
    for (const e of chosen) {
      const env = h("div", { class: "env" },
        h("p", { class: "env-head" }, e.title || e.name),
        h("p", { class: "meta" }, [e.name, e.version ? "version " + e.version : null, e.status, e.ratified_by ? "ratified by " + e.ratified_by : null,
          owned.has(e.name) ? null : "shared"].filter(Boolean).join(" · ")));
      if (e.scope) env.append(h("p", { class: "soft", style: "margin-top:4px" }, e.scope));
      const rules = e.rules || [];
      if (!rules.length) env.append(h("p", { class: "empty" }, "No rules in this environment yet."));
      const kinds = new Map();
      for (const r of rules) { const k = r.kind || "other"; if (!kinds.has(k)) kinds.set(k, []); kinds.get(k).push(r); }
      for (const [k, list] of kinds) {
        env.append(h("p", { class: "label kind-head" }, k + " · " + list.length));
        for (const r of list) env.append(ruleNode(r));
      }
      parts.push(env);
    }
    return [agent ? agent + "'s rules" : "Your rules", parts];
  },

  gates(data, arg) {
    const p = (data.projects || []).find((x) => x.id === arg.project);
    if (!p) return ["No such project", [h("p", { class: "empty" }, "No project in your seats file has this id now.")]];
    const trees = p.gates.worktrees;
    if (!trees.length) return [p.name, [h("p", { class: "empty" }, "No worktree was read here.")]];
    const rank = (t) => Math.min(...t.words.map((w) => ["off", "checks nothing", "open", "stranded", "unknown", "folder gone"].indexOf(w)).map((i) => i < 0 ? 9 : i));
    const t = trees.find((x) => x.path === arg.path) || trees.slice().sort((a, b) => rank(a) - rank(b))[0];
    const parts = [];
    if (trees.length > 1) {
      parts.push(h("div", { class: "switcher", role: "group", "aria-label": "Worktrees" }, trees.map((x) => h("button", { type: "button", "aria-pressed": String(x === t),
        on: { click: () => { S.drawer.arg = { project: p.id, path: x.path }; renderDrawer(false); } } }, h("span", { class: "mono" }, wtName(x)), stateWords(x)))));
    }
    parts.push(h("section", { class: "part" }, h("p", null, h("span", { class: "mono" }, t.path)), h("p", { style: "margin-top:4px" }, stateWords(t)),
      data.read_note ? h("p", { class: "meta", style: "margin-top:4px" }, "From " + data.read_note + ".") : null));
    parts.push(h("section", { class: "part" }, h("div", { class: "wt-body", style: "padding:0" }, worktreeDetail(t))));
    parts.push(h("section", { class: "part" }, h("a", { href: "#projects/" + encodeURIComponent(p.id), on: { click: () => closeDrawer(true) } }, "Open " + p.name)));
    return [p.name, parts];
  },

  docs(data, arg) {
    const p = (data.projects || []).find((x) => x.id === arg.project);
    if (!p) return ["No such project", [h("p", { class: "empty" }, "No project in your seats file has this id now.")]];
    const docs = (data.documents || []).filter((d) => d.project === p.id);
    const parts = [h("section", { class: "part" }, h("p", { class: "soft" }, docs.length ? plural(docs.length, "document") + " in " + p.name + ", each a cv folder holding a MASTER.md. Open one to read it here." : "No documents here."))];
    if (docs.length) parts.push(h("section", { class: "part" }, docs.map(docNode)));
    return [p.name, parts];
  },
};

// A rule, with how firmly it is held and the source of that level: the regression cases that name it, or the
// checker that refuses a break of it, with both arms. A guard the card only mentions is its claim, said as one.
function ruleNode(r) {
  const held = r.held || "written";
  const node = h("div", { class: "rule", "data-rule": r.id }, h("p", null, r.words),
    h("p", { class: "meta" }, h("span", { class: "mono" }, r.id), " · ", h("span", { class: held === "written" ? "soft" : "goldtext" }, held),
      r.agent ? " · " + r.agent + " only" : "", r.live === false ? " · switched off" : "", r.candidate ? " · not ratified" : ""));
  const why = h("ul", { class: "meta held-why" });
  if (held === "guarded") {
    for (const k of r.checkers || []) {
      why.append(h("li", null, "Guarded by " + k.name + (k.where ? " (" + k.where + (k.where_note ? ", " + k.where_note : k.where_exists === true ? ", which is there now" : k.where_exists === false ? ", which is not there now" : "") + ")" : "") + ": it must let pass " + k.must_pass.join("; ")
        + ", and it must refuse " + k.must_refuse.join("; ") + "."));
    }
  }
  const kept = (r.cases || []).filter((x) => x && x.kept_in && x.kept_in.length);
  if (kept.length) why.append(h("li", null, "Checked by " + kept.map((x) => x.id + " (kept in " + x.kept_in.join(", ") + ")").join(", ") + "."));
  const loose = (r.cases || []).filter((x) => x && (!x.kept_in || !x.kept_in.length));
  if (loose.length) why.append(h("li", null, "Names " + loose.map((x) => x.id).join(", ") + ", which no card keeps, so it checks nothing."));
  if (held === "written") why.append(h("li", null, "Its words alone: no regression case names it and no checker guards it."));
  if (r.guards && r.guards.length) why.append(h("li", null, "The card says: " + r.guards.join("; ") + ". No checker is named for it, so that counts for nothing."));
  node.append(why);
  return node;
}

// ---------------------------------------------------------------- start
$("problems-count").addEventListener("click", () => {
  S.problemsOpen = !S.problemsOpen;
  renderProblems();
  if (S.problemsOpen) { window.scrollTo(0, 0); $("problems").focus({ preventScroll: true }); }
});
$("drawer-close").addEventListener("click", () => closeDrawer());
$("scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.drawer) { ev.preventDefault(); closeDrawer(); } });
$("skip").addEventListener("click", (ev) => { ev.preventDefault(); $("main").focus(); });
window.addEventListener("hashchange", () => { closeDrawer(true); route(); });
window.addEventListener("focus", () => refresh());
setInterval(refresh, 10000);

(async function start() {
  await route();
  // A drawer can be opened from the address: ?open=agent:<id or name>, rules, rules:<agent>, gates:<project id>, docs:<project id>.
  const open = new URLSearchParams(location.search).get("open");
  if (open) {
    const cut = open.indexOf(":");
    const kind = cut < 0 ? open : open.slice(0, cut);
    const arg = cut < 0 ? "" : open.slice(cut + 1);
    if (kind === "agent") openDrawer("agent", /^[0-9a-f]{10}$/.test(arg) ? { id: arg } : { name: arg });
    else if (kind === "rules") openDrawer("rules", arg ? { agent: arg } : {});
    else if (kind === "gates" || kind === "docs") openDrawer(kind, { project: arg });
  }
})();
</script>
