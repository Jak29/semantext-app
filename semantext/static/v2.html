<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantext</title>
<style>
/* The page in four places, quiet by design (DESIGN.md has the reasons): neutral greys carry every surface, line and
   word; gold marks only where your word waits or where you act; red marks only what is broken. Four sizes (32, 24, 15,
   12) and two weights. Nothing here loads from the network. */
:root {
  color-scheme: light;
  --bg: #fafaf9;
  --surface: #f1f1ef;
  --raised: #ffffff;
  --line: #e6e6e2;
  --line-2: #d3d3ce;
  --text: #1b1b19;
  --text-2: #5a5a55;
  --text-3: #6f6f69;
  --accent: #b9831c;
  --accent-ink: #8a5f0b;
  --on-accent: #1d1503;
  --danger: #c2412d;
  --scrim: rgba(20, 20, 18, .22);
  --shadow: 0 12px 32px rgba(20, 20, 18, .14);
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1b1b1a; --raised: #222220; --line: #2a2a28; --line-2: #3b3b38;
    --text: #ececea; --text-2: #a6a6a0; --text-3: #80807a;
    --accent: #e8b553; --accent-ink: #e8b553; --on-accent: #1d1503; --danger: #f0705f;
    --scrim: rgba(0, 0, 0, .45); --shadow: 0 16px 40px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1b1b1a; --raised: #222220; --line: #2a2a28; --line-2: #3b3b38;
  --text: #ececea; --text-2: #a6a6a0; --text-3: #80807a;
  --accent: #e8b553; --accent-ink: #e8b553; --on-accent: #1d1503; --danger: #f0705f;
  --scrim: rgba(0, 0, 0, .45); --shadow: 0 16px 40px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 16px; top: -48px; padding: 6px 12px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; z-index: 20; }
.skip:focus { top: 10px; }
.mono { font-family: var(--mono); font-size: 12px; }
.meta { font-size: 12px; line-height: 1.5; color: var(--text-3); }
.soft { color: var(--text-2); }
.bad { color: var(--danger); }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }

/* ---------------- the bar: four places, one click each ---------------- */
.bar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 24px; min-height: 56px; padding: 0 24px;
  background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; }
.places { display: flex; flex-wrap: wrap; gap: 4px; }
.places a { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; }
.places a:hover { color: var(--text); background: var(--surface); }
.places a[aria-current="page"] { color: var(--text); background: var(--surface); font-weight: 600; }
.places .n { color: var(--accent-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.checked { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; }

/* ---------------- a place ---------------- */
main { max-width: 840px; margin: 0 auto; padding: 32px 32px 96px; }
main.wide { max-width: 1120px; }
main:focus { outline: none; }
.head { margin: 8px 0 28px; }
h1 { font-size: 32px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.sub { color: var(--text-2); margin-top: 8px; max-width: 72ch; }
.head .meta { margin-top: 6px; }
.crumbs { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.crumbs a { color: var(--text-2); }
.part + .part { margin-top: 40px; }
.part > .label { display: block; margin-bottom: 12px; }
.empty { color: var(--text-2); padding: 4px 0; }
.empty + .holds, .holds { color: var(--text-3); margin-top: 6px; max-width: 72ch; }

/* the problems banner */
.problems { margin: 0 0 28px; padding: 12px 16px; border: 1px solid var(--danger); border-radius: 12px; }
.problems-title { font-weight: 600; }
.problems ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.problems li { display: grid; gap: 1px; }
.problems .pwhere { font: 12px/1.5 var(--mono); color: var(--text-3); overflow-wrap: anywhere; }
.problems details { margin-top: 8px; }
.problems details.problems-fold { margin-top: 0; }
.problems-fold > summary { color: var(--text); }
.problems-fold > summary::before { color: var(--danger); }

/* controls */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 20px; }
.input { height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); min-width: 0; }
.input:focus { border-color: var(--text-3); }
.search { flex: 1 1 260px; max-width: 420px; }
.toggle { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); white-space: nowrap; }
.toggle:hover { border-color: var(--text-3); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; color: var(--text-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
.seg .n { font-variant-numeric: tabular-nums; color: var(--text-3); margin-left: 6px; font-weight: 400; }
.link { border: 0; background: none; padding: 0; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); text-align: left; }
.link:hover { color: var(--text); text-decoration-color: currentColor; }
details > summary { cursor: pointer; list-style: none; color: var(--text-2); }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; color: var(--text-3); }
details[open] > summary::before { content: "\2013  "; }

/* ---------------- a card, as your inbox shows it ---------------- */
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid transparent; border-radius: 12px; padding: 14px 18px; scroll-margin-top: 80px; }
.card.is-waiting { border-left: 3px solid var(--accent); border-radius: 4px 12px 12px 4px; }
.card.is-done, .card.is-parked { background: transparent; border-color: var(--line); }
.card.is-parked { border-style: dashed; }
.card:focus { outline: none; }
.card.target { box-shadow: 0 0 0 2px var(--accent); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.at { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2);
  font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; text-decoration: none; }
.chip.seat { color: var(--text); }
.chip.kind { border-color: transparent; background: var(--bg); }
.card.is-done .chip.kind, .card.is-parked .chip.kind { background: var(--surface); }
button.chip:hover, a.chip:hover { border-color: var(--text-3); color: var(--text); }
button.id { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font: 600 12px/1.5 var(--mono); cursor: copy; }
button.id:hover { border-color: var(--accent); }
.card-title { margin: 8px 0 4px; font-size: 15px; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.why { overflow-wrap: anywhere; }
.question { margin: 10px 0 4px; font-weight: 600; }
.options { margin: 0; padding-left: 22px; }
.options li + li { margin-top: 2px; }
.where, .closed, .status { margin: 10px 0 0; font-size: 12px; color: var(--text-2); }
.park { margin: 4px 0 0; font-size: 12px; color: var(--text-3); }
.refused { margin: 10px 0 0; font-size: 12px; color: var(--danger); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0; }
.facts dt { font-size: 12px; color: var(--text-3); padding-top: 3px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
pre.command { margin: 10px 0 0; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
.more { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.who { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tip { text-decoration: underline dotted; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: help; }
.more details > summary { font-size: 12px; }
.said { margin-top: 10px; }
.said .meta a { color: var(--text-2); }
blockquote.words { margin: 4px 0 0; padding: 1px 0 1px 12px; border-left: 2px solid var(--line-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.group-head { margin: 24px 0 10px; }
.group-head:first-child { margin-top: 0; }
.shelf { margin-top: 28px; }
.shelf > summary { font-weight: 600; padding: 6px 0; }
.shelf > .cards, .shelf > .shelf-note { margin-top: 12px; }
.shelf-note { font-size: 12px; color: var(--text-3); }
.shelf-note a { color: var(--text-2); }

/* ---------------- projects ---------------- */
.rows { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(220px, 2fr) minmax(190px, 1.3fr) minmax(90px, .6fr) minmax(110px, .7fr);
  gap: 16px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.prow.head-row { padding: 10px 4px; }
.pname a { font-weight: 600; text-decoration: none; }
.pname a:hover { text-decoration: underline; }
.ppath { font: 12px/1.5 var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cellbtn { display: grid; gap: 1px; text-align: left; border: 0; background: none; padding: 0; color: inherit; }
.cellbtn:hover .w { text-decoration: underline; text-underline-offset: 3px; }
.cellbtn .meta { font-size: 12px; }
.none { color: var(--text-3); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
.mark { display: inline-block; flex: none; width: 9px; height: 9px; border: 2px solid var(--danger); border-radius: 2px; margin-right: 8px; vertical-align: 0; }
.goldtext { color: var(--accent-ink); font-weight: 600; }
.alist { display: grid; gap: 10px; }
.arow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.wts { border-top: 1px solid var(--line); }
.wt { border-bottom: 1px solid var(--line); }
.wt > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 2px; }
.wt > summary .mono { color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
.wt > summary::before { flex: none; }
.words-row { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.wt-body { padding: 4px 2px 18px 18px; display: grid; gap: 10px; }
table.events { border-collapse: collapse; width: 100%; max-width: 680px; }
table.events th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; padding: 0 14px 6px 0; border-bottom: 1px solid var(--line); }
table.events td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
table.events td.mono { white-space: nowrap; }
.doc { padding: 12px 0; border-bottom: 1px solid var(--line); }
.doc:first-child { border-top: 1px solid var(--line); }
.doc ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------------- the map ---------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; align-content: start; min-height: 116px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: inherit; text-decoration: none; text-align: left; }
.tile:hover { border-color: var(--line-2); background: var(--surface); }
.tile .name { font-weight: 600; overflow-wrap: anywhere; }
.tile .kind { font-size: 12px; color: var(--text-3); }
.marks { display: flex; align-items: baseline; font-size: 12px; color: var(--text-2); }
.marks.bad { color: var(--danger); }
.marks.quiet { color: var(--text-3); }
.sectors { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.legend { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 4px; }

/* ---------------- the record ---------------- */
.thread { padding: 18px 0; border-bottom: 1px solid var(--line); }
.thread:first-child { border-top: 1px solid var(--line); }
.subject { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.entry { margin-top: 8px; border-radius: 4px; scroll-margin-top: 90px; }
.entry + .entry { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-2); }
.entry:focus { outline: none; }
.entry.target { box-shadow: 0 0 0 2px var(--accent); }
.entry .meta { margin-top: 2px; }
.entry .words { margin-top: 8px; }
.pin { font: 12px/1.5 var(--mono); color: var(--text-3); margin-top: 8px; overflow-wrap: anywhere; }
.rel { font-size: 12px; color: var(--text-3); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.rel a { color: var(--text-2); font-family: var(--mono); }
.note { margin: 10px 0 0 4px; padding-left: 12px; border-left: 1px solid var(--line-2); }
.state-word { color: var(--text-2); }
.state-word.quiet { color: var(--text-3); }

/* ---------------- drawers ---------------- */
.scrim { position: fixed; inset: 0; z-index: 8; background: var(--scrim); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 9; width: min(560px, 100vw); display: flex; flex-direction: column;
  background: var(--raised); border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.drawer-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 18px 24px 16px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 24px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; }
.drawer-head .label { grid-column: 1; }
.drawer-head h2 { grid-column: 1; }
.close { grid-column: 2; grid-row: 1 / span 2; align-self: start; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); }
.close:hover { color: var(--text); border-color: var(--text-3); }
.drawer-body { overflow: auto; padding: 18px 24px 48px; }
.drawer-body .part + .part { margin-top: 28px; }
.drawer-body .facts { margin-top: 0; }
.rule { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rule:first-of-type { border-top: 1px solid var(--line); }
.rule .meta { margin-top: 3px; }
.kind-head { margin: 18px 0 8px; }
.env { margin-top: 28px; }
.env + .env { padding-top: 20px; border-top: 1px solid var(--line-2); }
.env-head { font-weight: 600; }
.switcher { display: grid; gap: 6px; margin-bottom: 16px; }
.switcher button { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
.switcher button[aria-pressed="true"] { background: var(--surface); border-color: var(--line-2); }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 12; transform: translateX(-50%); padding: 9px 18px; border-radius: 999px; background: var(--text); color: var(--bg); }

@media (max-width: 900px) {
  .prow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .prow.head-row { display: none; }
}
@media (max-width: 720px) {
  .bar { flex-wrap: wrap; gap: 6px 12px; padding: 10px 16px; }
  .checked { margin-left: 0; width: 100%; }
  main, main.wide { padding: 20px 16px 72px; }
  .prow { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  h1 { font-size: 24px; }
  .wt-body { padding-left: 2px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: drawer-in .16s ease-out; }
  @keyframes drawer-in { from { transform: translateX(12px); opacity: .7; } }
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to the content</a>
<header class="bar">
  <span class="brand">Semantext</span>
  <nav class="places" aria-label="Places">
    <a data-place="waiting" href="#waiting" id="tab-waiting">Waiting <span class="n" id="count-waiting"></span></a>
    <a data-place="projects" href="#projects" id="tab-projects">Projects</a>
    <a data-place="map" href="#map" id="tab-map">Map</a>
    <a data-place="record" href="#record" id="tab-record">Record</a>
  </nav>
  <span class="checked" id="checked" role="status">Reading your files…</span>
</header>
<main id="main" tabindex="-1">
  <section class="problems" id="problems" aria-label="Problems" hidden></section>
  <div id="place"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <p class="label" id="drawer-kind"></p>
    <h2 id="drawer-title" tabindex="-1"></h2>
    <button class="close" id="drawer-close" type="button" aria-label="Close" title="Close (Esc)">&#x2715;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
// Every piece of the person's text is set as text: elements are made with createElement, and words go in as text
// nodes, never parsed as markup. The page only reads: it sends the X-Semantext header with every read, runs nothing,
// and writes nothing anywhere.

const $ = (id) => document.getElementById(id);
const PROPS = new Set(["open", "hidden", "type", "value", "disabled", "checked", "tabIndex", "placeholder"]);

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "on") for (const [type, fn] of Object.entries(v)) node.addEventListener(type, fn);
    else if (PROPS.has(k)) node[k] = v;
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : String(kid));
  }
  return node;
}

// ---------------------------------------------------------------- words and times
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const stamp = (iso) => { const t = Date.parse(iso); return Number.isNaN(t) ? 0 : t; };
function when(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return iso || "";
  return d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function day(date) {
  if (!date) return "";
  const d = new Date(String(date).slice(0, 10) + "T12:00:00");
  return Number.isNaN(d.getTime()) ? String(date) : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
const clock = () => new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function listWords(items) {
  const xs = items.filter(Boolean);
  return xs.length <= 1 ? (xs[0] || "") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
}
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
// A long path by its last two folders, which tell paths apart; the whole path goes in the tooltip.
function tail(path) {
  const parts = String(path || "").split(/[\\/]+/).filter(Boolean);
  const sep = String(path || "").includes("\\") ? "\\" : "/";
  return parts.length > 3 ? "…" + sep + parts.slice(-2).join(sep) : String(path || "");
}
// Breadcrumbs: each piece in its own box, so the separators keep their space.
function crumbs(...pieces) {
  const nav = h("nav", { class: "crumbs", "aria-label": "Where you are" });
  pieces.forEach((p, i) => { if (i) nav.append(h("span", { "aria-hidden": "true" }, "›")); nav.append(p instanceof Node ? p : h("span", null, p)); });
  return nav;
}
// Cards newest first, as the inbox orders them; a tie keeps the order the files give.
const newestFirst = (list) => list.slice().sort((a, b) => stamp(b.at) - stamp(a.at));

// ---------------------------------------------------------------- the state of the page
const S = {
  place: null, sub: null, mounted: null,
  data: {}, sig: {}, frame: null, err: null, busy: false,
  open: new Set(), q: { waiting: "", record: "" }, facet: "all", byProject: false,
  drawer: null, opener: null,
  target: null,   // { place, key, focused }: the card or decision a link pointed at, marked until you go elsewhere
};

// Mark the element a link pointed at: on every drawing while you stay, and brought into view and focused once.
function applyTarget(place, attr) {
  const t = S.target;
  if (!t || t.place !== place) return;
  const el = document.querySelector("[" + attr + '="' + CSS.escape(t.key) + '"]');
  if (!el) return;
  el.classList.add("target");
  if (!t.focused) { t.focused = true; S.moved = true; el.scrollIntoView({ block: "center" }); el.focus({ preventScroll: true }); }
}
const ROUTE = { waiting: "waiting", projects: "projects", map: "map", record: "record" };
const DRAWER_ROUTE = { agent: "map", rules: "rules", gates: "projects", docs: "projects" };
const READER = { waiting: "Waiting", record: "Record", rules: "Rules", gates: "Gates", places: "Places", sources: "Sources", page: "This page" };
const BROKEN = new Set(["off", "checks nothing", "open", "stranded"]);

async function get(route) {
  const r = await fetch("/api/v2/" + route, { headers: { "X-Semantext": "1" }, cache: "no-store" });
  if (!r.ok) {
    let why = "the server answered " + r.status;
    try { why = (await r.json()).error || why; } catch (e) { /* the status says enough */ }
    throw new Error(why);
  }
  return r.json();
}

// A refresh that changed nothing changes nothing on the page: open sections, search text and scroll stay as they are.
function accept(route, data) {
  if (data && data.frame) applyFrame(data.frame);
  const copy = Object.assign({}, data, { frame: Object.assign({}, data.frame, { checked: null }) });
  const sig = JSON.stringify(copy);
  if (S.sig[route] === sig) return false;
  S.sig[route] = sig;
  S.data[route] = data;
  return true;
}

async function load(route) {
  const changed = accept(route, await get(route));
  if (changed && S.place && ROUTE[S.place] === route) fill();
  if (changed && S.drawer && DRAWER_ROUTE[S.drawer.kind] === route) renderDrawer(false);
  return changed;
}

async function refresh() {
  if (S.busy || !S.place) return;
  S.busy = true;
  try {
    await load(ROUTE[S.place]);
    if (S.drawer && DRAWER_ROUTE[S.drawer.kind] !== ROUTE[S.place]) await load(DRAWER_ROUTE[S.drawer.kind]);
    S.err = null;
    $("checked").textContent = "Checked " + clock();
  } catch (e) {
    S.err = String(e && e.message || e);
    $("checked").textContent = "Could not check at " + clock();
  } finally {
    S.busy = false;
    renderProblems();
  }
}

// ---------------------------------------------------------------- the frame: the bar, and the problems banner
const mapKey = () => (S.frame && S.frame.word) || "map";

function applyFrame(f) {
  S.frame = f;
  const tab = $("tab-map");
  tab.textContent = f.name || "Map";
  tab.href = "#" + mapKey();
  const n = f.waiting || 0;
  $("count-waiting").textContent = n ? String(n) : "";
  $("tab-waiting").setAttribute("aria-label", n ? "Waiting, " + plural(n, "card") : "Waiting, nothing");
  renderProblems();
}

// The banner shows only when there are problems: in full on Waiting, as your inbox shows them, and folded to its first
// line in the other places, so it is always in sight and never in the way.
function renderProblems() {
  const box = $("problems");
  const list = ((S.frame && S.frame.problems) || []).slice();
  if (S.err) list.unshift({ reader: "page", source: "", line: null, text: "The page could not read your files just now: " + S.err });
  box.hidden = list.length === 0;
  if (!list.length) { box.replaceChildren(); return; }
  const item = (p) => h("li", null, h("span", null, cap(p.text || p.kind || "a problem")),
    h("span", { class: "pwhere" }, [p.source || "", p.line ? "line " + p.line : ""].filter(Boolean).join(", ")
      + (READER[p.reader] ? (p.source ? " · " : "") + READER[p.reader] : "")));
  const full = (into) => {
    into.append(h("ul", null, list.slice(0, 5).map(item)));
    if (list.length > 5) {
      const more = disclosure("problems:more", plural(list.length - 5, "more problem"));
      more.append(h("ul", null, list.slice(5).map(item)));
      into.append(more);
    }
  };
  if (S.place === "waiting" || !S.place) {
    const title = h("p", { class: "problems-title" }, "Something in your files needs fixing:");
    box.replaceChildren(title);
    full(box);
  } else {
    const fold = disclosure("problems:show", h("span", null, h("span", { class: "problems-title" }, "Something in your files needs fixing: "),
      plural(list.length, "problem")), "problems-fold");
    full(fold);
    box.replaceChildren(fold);
  }
}

// ---------------------------------------------------------------- moving between places
function parseHash() {
  let raw = location.hash.replace(/^#/, "");
  try { raw = decodeURIComponent(raw); } catch (e) { /* a hash that is not encoding is read as it is */ }
  const cut = raw.indexOf("/");
  const head = cut < 0 ? raw : raw.slice(0, cut);
  const sub = cut < 0 ? null : raw.slice(cut + 1) || null;
  if (!head) return { place: "waiting", sub: null };
  if (head === "waiting" || head === "projects" || head === "record") return { place: head, sub };
  if (head === "map" || (S.frame && S.frame.word && head === S.frame.word)) return { place: "map", sub };
  return { place: null, head, sub };
}

async function route() {
  let r = parseHash();
  if (!r.place && !S.frame) {
    try { accept("sources", await get("sources")); } catch (e) { S.err = String(e.message || e); }
    r = parseHash();
  }
  if (!r.place) r = { place: "waiting", sub: null };
  const key = r.place + "/" + (r.sub || "");
  const moved = key !== S.mounted;
  S.place = r.place;
  S.sub = r.sub;
  if (moved && S.target && (S.target.place !== r.place || r.place === "record")) S.target = null;
  if (r.place === "record" && r.sub && moved) { S.facet = "all"; S.q.record = ""; S.target = { place: "record", key: r.sub, focused: false }; }
  for (const a of document.querySelectorAll(".places a")) {
    if (a.dataset.place === r.place) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  $("main").className = r.place === "projects" || r.place === "map" ? "wide" : "";
  if (moved) {
    S.mounted = key;
    mount();
    window.scrollTo(0, 0);
  }
  if (S.data[ROUTE[S.place]]) fill();
  try {
    await load(ROUTE[S.place]);
    S.err = null;
    $("checked").textContent = "Checked " + clock();
  } catch (e) {
    S.err = String(e.message || e);
    if (!S.data[ROUTE[S.place]]) fill();
  }
  renderProblems();
}

const MOUNT = { waiting: mountWaiting, projects: () => {}, map: () => {}, record: mountRecord };
const FILL = { waiting: fillWaiting, projects: fillProjects, map: fillMap, record: fillRecord };
function mount() { $("place").replaceChildren(); MOUNT[S.place](); }
function fill() { keep(() => FILL[S.place]()); }

// Re-drawing keeps the scroll and, where it can, the focused control; only a link's target moves the page.
function keep(fn) {
  const y = window.scrollY;
  const a = document.activeElement;
  const k = a && a.dataset ? a.dataset.k : null;
  S.moved = false;
  fn();
  if (k && !document.contains(a)) {
    const again = document.querySelector('[data-k="' + CSS.escape(k) + '"]');
    if (again) again.focus({ preventScroll: true });
  }
  if (!S.moved && Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  S.moved = false;
}

function disclosure(key, summary, cls) {
  const d = h("details", { class: cls || null });
  d.open = S.open.has(key);
  d.append(summary instanceof Node ? h("summary", { "data-k": key }, summary) : h("summary", { "data-k": key }, summary));
  d.addEventListener("toggle", () => { if (d.open) S.open.add(key); else S.open.delete(key); });
  return d;
}

function header(title, sub, meta, crumbs) {
  return h("header", { class: "head" }, crumbs || null, h("h1", null, title), sub ? h("p", { class: "sub" }, sub) : null,
    meta ? h("p", { class: "meta" }, meta) : null);
}

function goCard(key) {
  S.target = { place: "waiting", key, focused: false };
  closeDrawer(true);
  if (S.q.waiting) { S.q.waiting = ""; if (W.search) W.search.value = ""; }
  if (location.hash === "#waiting") fill(); else location.hash = "#waiting";
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}

async function copyId(button) {
  const id = button.dataset.id;
  try {
    await navigator.clipboard.writeText(id);
    button.textContent = "Copied";
  } catch (e) {
    // If the clipboard is refused, the ID is selected so Ctrl+C copies it.
    const range = document.createRange();
    range.selectNodeContents(button);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast("Press Ctrl+C to copy " + id);
  }
  setTimeout(() => { button.textContent = id; }, 1500);
}

// ---------------------------------------------------------------- the card, as your inbox shows it
function chip(text, cls) { return h("span", { class: "chip " + cls }, text); }

function agentChip(name, id, k) {
  return h("button", { class: "chip seat", type: "button", "data-k": k || null, title: "Open " + name,
    on: { click: (ev) => openDrawer("agent", id ? { id } : { name }, ev.currentTarget) } }, name);
}

function runLine(run) {
  if (!run.finished) return h("p", { class: "status" }, "Started " + when(run.started) + ", and no result was recorded.");
  if (run.timed_out) return h("p", { class: "status bad" }, "Stopped after 30 minutes, " + when(run.finished) + ".");
  if (run.exit === 0) return h("p", { class: "status" }, "Ran " + when(run.finished) + ", and finished cleanly.");
  return h("p", { class: "status bad" }, "Ran " + when(run.finished) + ", and failed (exit " + (run.exit ?? "unknown") + ").");
}

function cardNode(c) {
  const waiting = c.state === "waiting", parked = c.state === "parked", done = c.state === "closed" || c.state === "run";
  const node = h("article", { class: "card " + (waiting ? "is-waiting" : parked ? "is-parked" : "is-done"), "data-card": c.key,
    "data-k": "card:" + c.key, tabindex: "-1" });
  const id = h("button", { class: "id", type: "button", title: "Copy this ID", "data-id": c.id, "data-k": "id:" + c.key,
    on: { click: (ev) => copyId(ev.currentTarget) } }, c.id);
  const at = h("time", { class: "at", datetime: c.at || null }, when(c.at));
  node.append(h("div", { class: "card-head" }, agentChip(c.seat, null, "seat:" + c.key),
    chip(c.kind === "command" ? "Command" : "Decision", "kind"), id, at));
  node.append(h("h2", { class: "card-title" }, c.title), h("p", { class: "why" }, c.why));
  if (c.kind === "command") {
    const facts = h("dl", { class: "facts" });
    if (c.does) facts.append(h("dt", null, "What it does"), h("dd", null, c.does));
    if (c.undo) facts.append(h("dt", null, "Undo"), h("dd", null, c.undo));
    if (c.cwd) facts.append(h("dt", null, "Runs in"), h("dd", { class: "mono" }, c.cwd));
    if (facts.childNodes.length) node.append(facts);
    node.append(h("pre", { class: "command" }, c.command || ""));
    if (c.run) node.append(runLine(c.run));
    else if (waiting) node.append(h("p", { class: "where", title: "This page never runs anything." }, "Run it from your inbox."));
  } else {
    if (c.question) node.append(h("p", { class: "question" }, c.question));
    if (c.options && c.options.length) node.append(h("ol", { class: "options" }, c.options.map((o) => h("li", null, o))));
    if (waiting) node.append(h("p", { class: "where" }, "Answer in " + c.seat + "'s chat: paste the ID, then your decision."));
  }
  for (const note of c.notes || []) node.append(h("p", { class: "refused" }, note));
  if (c.closing) node.append(h("p", { class: "closed" }, "Closed " + when(c.closing.at) + (c.closing.how ? ": " + c.closing.how : ".")));
  if (waiting) node.append(h("p", { class: "park" }, "Park it from your inbox for now."));
  if (parked) node.append(h("p", { class: "park" }, "Parked " + when(c.parked_at) + ". " + c.seat + " holds it until you bring it back from your inbox."));
  node.append(cardMore(c));
  return node;
}

// What this page adds under a card: who asks and who acts, its project, and your earlier words.
function cardMore(c) {
  const who = h("p", { class: "who" },
    h("span", { class: "tip", title: "How the page knows: " + (c.asks_basis || "not said") }, "Asks: " + c.asks),
    "·", h("span", { class: "tip", title: "How the page knows: " + (c.acts_basis || "not said") }, "Acts: " + c.acts));
  if (c.project) {
    const why = c.project.via === "cwd" ? "it runs in this project's folder" : "its " + (c.project.field || "words") + " name this project's folder";
    who.append("·", h("a", { class: "chip", href: "#projects/" + encodeURIComponent(c.project.id), title: "In this project because " + why,
      "data-k": "proj:" + c.key }, c.project.name || "a project"));
  }
  const box = h("div", { class: "more" }, who);
  if (c.earlier && c.earlier.length) {
    const d = disclosure("earlier:" + c.key, "Your earlier words (" + c.earlier.length + ")");
    for (const e of c.earlier) {
      d.append(h("div", { class: "said" },
        h("p", { class: "meta" }, h("a", { href: "#record/" + encodeURIComponent(e.id), class: "mono" }, e.id),
          " · " + day(e.date) + " · " + (e.status || "no status") + " · " + e.link),
        h("blockquote", { class: "words" }, e.words || "(no words recorded)")));
    }
    box.append(d);
  }
  return box;
}

// ---------------------------------------------------------------- Waiting
const W = {};

function mountWaiting() {
  W.head = h("div");
  W.search = h("input", { class: "input search", type: "search", placeholder: "Search the cards", "aria-label": "Search the cards",
    value: S.q.waiting, "data-k": "search:waiting" });
  W.search.addEventListener("input", () => { S.q.waiting = W.search.value; fill(); });
  W.group = h("button", { class: "toggle", type: "button", "aria-pressed": String(S.byProject), "data-k": "byproject" }, "By project");
  W.group.addEventListener("click", () => { S.byProject = !S.byProject; W.group.setAttribute("aria-pressed", String(S.byProject)); fill(); });
  W.tools = h("div", { class: "tools" }, W.search, W.group);
  W.list = h("section", { class: "cards", "aria-label": "Waiting for you" });
  W.empty = h("div", { hidden: true });
  W.parked = h("div");
  W.done = h("div");
  $("place").replaceChildren(W.head, W.tools, W.list, W.empty, W.parked, W.done);
}

function cardText(c) {
  return [c.id, c.seat, c.title, c.why, c.question, ...(c.options || []), c.command, c.does, c.undo, c.cwd,
    c.project && c.project.name].filter(Boolean).join("\n").toLowerCase();
}

function fillWaiting() {
  const data = S.data.waiting;
  if (!data) { W.head.replaceChildren(header("Waiting", "Reading your files…")); return; }
  if (data.off) {
    W.head.replaceChildren(header("Waiting", "Waiting is off: your sources file names no " + listWords(data.missing.map((k) => '"' + k + '"')) + ".",
      S.frame ? "Your sources file: " + S.frame.config : null));
    W.tools.hidden = true;
    for (const x of [W.list, W.empty, W.parked, W.done]) x.replaceChildren();
    return;
  }
  W.tools.hidden = false;
  const q = S.q.waiting.trim().toLowerCase();
  const match = (c) => !q || cardText(c).includes(q);
  const all = newestFirst(data.cards);
  const waiting = all.filter((c) => c.state === "waiting");
  const parked = data.cards.filter((c) => c.state === "parked").sort((a, b) => stamp(b.parked_at) - stamp(a.parked_at));
  const done = all.filter((c) => c.state === "closed" || c.state === "run");
  const w = waiting.filter(match), p = parked.filter(match), d = done.filter(match);
  const sub = waiting.length === 0 ? "Nothing is waiting for you."
    : (waiting.length === 1 ? "1 card waits for your word." : waiting.length + " cards wait for your word, newest first.")
      + (q ? " " + w.length + " of them " + (w.length === 1 ? "matches" : "match") + "." : "");
  W.head.replaceChildren(header("Waiting", sub, data.seats.length ? "From the requests of " + listWords(data.seats) + "." : "No agent's requests are read."));

  if (S.byProject && w.length) {
    const groups = new Map();
    for (const c of w) {
      const k = c.project ? (c.project.name || c.project.id) : "";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(c);
    }
    const names = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
    if (groups.has("")) names.push("");
    W.list.replaceChildren(...names.map((k) => h("div", null,
      h("h2", { class: "label group-head" }, (k || "Not in a project") + " · " + groups.get(k).length),
      h("div", { class: "cards" }, groups.get(k).map(cardNode)))));
  } else {
    W.list.replaceChildren(...w.map(cardNode));
  }
  W.empty.hidden = w.length !== 0;
  if (!waiting.length) {
    W.empty.replaceChildren(h("p", { class: "empty" }, "Nothing is waiting for you."), h("p", { class: "holds" }, data.holds ? data.holds.text : ""));
  } else if (!w.length) {
    W.empty.replaceChildren(h("p", { class: "empty" }, "No waiting card matches “" + S.q.waiting.trim() + "”."));
  }

  const parkedDecisions = data.record && !data.record.off ? data.record.parked : 0;
  W.parked.replaceChildren();
  if (parked.length || parkedDecisions) {
    const box = disclosure("shelf:parked", "Parked " + (q ? p.length + " of " + parked.length : parked.length), "shelf");
    if (box.open) {
      if (p.length) box.append(h("div", { class: "cards" }, p.map(cardNode)));
      if (parkedDecisions) box.append(h("p", { class: "shelf-note" }, plural(parkedDecisions, "decision is", "decisions are") + " parked in your register: ",
        h("a", { href: "#record", on: { click: () => { S.facet = "parked"; S.q.record = ""; } } }, "see them in the Record"), "."));
    }
    box.addEventListener("toggle", () => fill());
    W.parked.append(box);
  }
  W.done.replaceChildren();
  if (done.length) {
    const box = disclosure("shelf:done", "Done " + (q ? d.length + " of " + done.length : done.length), "shelf");
    if (box.open) box.append(h("div", { class: "cards" }, d.map(cardNode)));
    box.addEventListener("toggle", () => fill());
    W.done.append(box);
  }
  applyTarget("waiting", "data-card");
}

// ---------------------------------------------------------------- Projects
function basisWords(m) {
  const basis = m.basis || [];
  const parts = [];
  if (basis.includes("home")) parts.push("its home");
  if (basis.includes("identity")) parts.push("listed in .identity" + (m.emails && m.emails.length ? " as " + m.emails.join(", ") : ""));
  return parts.join("; ") || "listed";
}

function gateCell(p, k) {
  const g = p.gates;
  if (!g.found) return h("span", { class: "none" }, "no gate read");
  if (!g.worktrees.length) return h("span", { class: "none" }, "no worktree found");
  const broken = BROKEN.has(g.worst);
  return h("button", { class: "cellbtn", type: "button", "data-k": k, title: "Open the gates",
    on: { click: (ev) => openDrawer("gates", { project: p.id }, ev.currentTarget) } },
    h("span", { class: "w" + (broken ? " bad" : "") }, g.worst + " (read)"),
    h("span", { class: "meta" }, g.broken ? g.broken + " of " + plural(g.worktrees.length, "worktree") : plural(g.worktrees.length, "worktree")));
}

function fillProjects() {
  const data = S.data.projects;
  const place = $("place");
  if (!data) { place.replaceChildren(header("Projects", "Reading your files…")); return; }
  if (S.sub) return fillProject(data, S.sub);
  if (data.off) {
    place.replaceChildren(header("Projects", "Projects are off: your sources file names no seats file.", S.frame ? "Your sources file: " + S.frame.config : null));
    return;
  }
  const rows = data.projects;
  const sub = plural(rows.length, "project") + " from your seats file, with " + plural(data.worktrees, "worktree")
    + ". " + data.assigned + " of " + plural(data.total, "card") + " belong to one.";
  const head = header("Projects", sub, data.read_note ? "Gate states come from " + data.read_note.replace(/^a /, "a ") + ". Each is marked (read)." : null);
  if (!rows.length) {
    place.replaceChildren(head, h("p", { class: "empty" }, "No projects yet. Name a root of kind “repo” in your seats file, and it shows here."));
    return;
  }
  const table = h("div", { class: "rows", role: "table", "aria-label": "Projects" },
    h("div", { class: "prow head-row", role: "row" }, ["Project", "Agents", "Gates, at their worst", "Waiting", "Documents"].map((t) => h("span", { class: "label", role: "columnheader" }, t))));
  for (const p of rows) {
    table.append(h("div", { class: "prow", role: "row" },
      h("div", { class: "pname", role: "cell" }, h("a", { href: "#projects/" + encodeURIComponent(p.id), "data-k": "p:" + p.id }, p.name),
        h("div", { class: "ppath", title: p.path }, tail(p.path))),
      h("div", { class: "chips", role: "cell" }, p.agents.length ? p.agents.map((a) => agentChip(a.name, a.agent_id, "pa:" + p.id + ":" + a.agent_id)) : h("span", { class: "none" }, "nobody listed")),
      h("div", { role: "cell" }, gateCell(p, "pg:" + p.id)),
      h("div", { role: "cell", class: "cellbtn" }, p.waiting.length ? h("span", { class: "goldtext" }, h("span", { class: "dot", "aria-hidden": "true" }), p.waiting.length + " waiting")
        : h("span", { class: "none", title: "Nothing waits here" }, "–"), p.cards.length ? h("span", { class: "meta" }, plural(p.cards.length, "card") + " in all") : null),
      h("div", { role: "cell" }, p.documents.length ? h("button", { class: "link", type: "button", "data-k": "pd:" + p.id,
        on: { click: (ev) => openDrawer("docs", { project: p.id }, ev.currentTarget) } }, plural(p.documents.length, "document"))
        : h("span", { class: "none", title: "No documents" }, "–"))));
  }
  place.replaceChildren(head, table);
}

function worktreeDetail(t) {
  const out = [];
  if (t.status === "missing") out.push(h("p", null, t.note || "The worktree's folder is gone."));
  if (t.status === "unknown") out.push(h("p", null, "No verdict: the reader could not be sure of git's settings here (see below)."));
  if (t.events.length) {
    out.push(h("table", { class: "events" },
      h("thead", null, h("tr", null, ["Act", "State", "Hook", "Note"].map((x) => h("th", null, x)))),
      h("tbody", null, t.events.map((e) => h("tr", null,
        h("td", null, e.event),
        h("td", { class: e.state === "open" ? "bad" : null }, e.state + " (read)"),
        h("td", { class: "mono" }, e.by || (e.needs ? "needs " + e.needs.join(" or ") : "")),
        h("td", { class: "soft" }, e.note || ""))))));
  }
  const hp = t.hooks_path;
  if (hp && hp.set) {
    out.push(h("p", null, "core.hooksPath is ", h("span", { class: "mono" }, hp.value), ", set in the " + (hp.scope || "unknown") + " settings: ",
      h("span", { class: "mono" }, (hp.file || "") + (hp.line ? " line " + hp.line : "")),
      hp.via && hp.via.length ? " (included by " + hp.via.join(", ") + ")" : "", "."));
  } else if (t.status === "read") {
    out.push(h("p", null, "core.hooksPath is not set, so git runs hooks from ", h("span", { class: "mono" }, t.hooks_dir || "its own hooks folder"), "."));
  }
  if (hp && hp.set && t.hooks_dir) out.push(h("p", { class: "soft" }, "Hooks run from ", h("span", { class: "mono" }, t.hooks_dir), "."));
  if (t.identity) {
    out.push(h("p", { class: t.identity.present && t.identity.entries ? "soft" : "bad" }, t.identity.present
      ? ".identity names " + plural(t.identity.entries, "committer") + (t.identity.entries ? "." : ", so a hook that checks it lets every commit through.")
      : "No .identity file here, so a hook that checks it lets every commit through.",
      " ", h("span", { class: "mono" }, t.identity.file || "")));
  }
  for (const s of t.stranded || []) {
    out.push(h("p", { class: "bad" }, "Stranded (read): " + s.name + " exists in " + (s.where || []).join(", ") + ", where git does not look."));
  }
  if (t.uncertain && t.uncertain.length) {
    out.push(h("div", null, h("p", { class: "label" }, "Not certain"), h("ul", { class: "soft" }, t.uncertain.map((u) => h("li", null, u)))));
  }
  if (t.files && t.files.length) {
    const d = disclosure("files:" + t.path, plural(t.files.length, "settings file") + " read");
    d.append(h("ul", { class: "mono" }, t.files.map((f) => h("li", null, f.scope + ": " + f.file + (f.included_by ? " (included by " + f.included_by + ")" : "")))));
    out.push(d);
  }
  return out;
}

function stateWords(t) {
  return h("span", { class: "words-row" }, t.words.map((w) => h("span", { class: BROKEN.has(w) ? "bad" : "soft" }, w + " (read)")));
}

function docNode(d) {
  return h("div", { class: "doc" },
    h("p", { class: "subject" }, d.title || d.slug),
    h("p", { class: "meta" }, (d.agent ? d.agent + " · " : "") + "cv/" + d.slug + " · updated " + when(d.updated)),
    d.docs.length ? h("ul", null, d.docs.map((x) => h("li", null, x.title || x.file, h("span", { class: "meta" }, " · " + x.file + " · " + when(x.updated))))) : null,
    d.diagrams.length ? h("p", { class: "meta" }, plural(d.diagrams.length, "diagram") + ": " + d.diagrams.join(", ")) : null);
}

function fillProject(data, id) {
  const place = $("place");
  const p = data.projects.find((x) => x.id === id);
  const trail = crumbs(h("a", { href: "#projects" }, "Projects"), p ? p.name : id);
  if (!p) {
    place.replaceChildren(header("No such project", "No project in your seats file has this id now.", null, trail));
    return;
  }
  const agents = h("section", { class: "part" }, h("h2", { class: "label" }, "Agents"));
  if (p.agents.length) {
    agents.append(h("div", { class: "alist" }, p.agents.map((a) => h("div", { class: "arow" }, agentChip(a.name, a.agent_id, "pp:" + a.agent_id), h("span", { class: "soft" }, basisWords(a))))));
  } else agents.append(h("p", { class: "empty" }, "Nobody is listed. Add “Name <email>” lines to this project's .identity file."));
  if (p.others && p.others.length) agents.append(h("p", { class: "meta", style: "margin-top:10px" }, "Also listed in .identity, and no agent of yours: " + listWords(p.others.map((o) => o.name)) + "."));

  const gates = h("section", { class: "part" }, h("h2", { class: "label" }, "Gates"));
  if (!p.gates.found) gates.append(h("p", { class: "empty" }, "No gate was read: the folder is not a repository the reader could find."));
  else {
    if (data.read_note) gates.append(h("p", { class: "meta", style: "margin-bottom:10px" }, "From " + data.read_note + "."));
    const list = h("div", { class: "wts" });
    for (const t of p.gates.worktrees) {
      const d = disclosure("wt:" + t.path, h("span", { style: "display:contents" }, h("span", { class: "mono", title: t.path }, wtName(t)), stateWords(t)), "wt");
      d.append(h("div", { class: "wt-body" }, worktreeDetail(t)));
      list.append(d);
    }
    gates.append(p.gates.worktrees.length ? list : h("p", { class: "empty" }, "No worktree found."));
  }

  const cardsPart = h("section", { class: "part" }, h("h2", { class: "label" }, "Cards"));
  const mine = p.cards.map((k) => data.cards[k]).filter(Boolean);
  const order = { waiting: 0, parked: 1, closed: 2, run: 2 };
  const sorted = newestFirst(mine).sort((a, b) => (order[a.state] ?? 3) - (order[b.state] ?? 3));
  cardsPart.append(sorted.length ? h("div", { class: "cards" }, sorted.map(cardNode))
    : h("p", { class: "empty" }, "No card is placed in this project. A card belongs here when it runs in this folder or names it."));

  const docsPart = h("section", { class: "part" }, h("h2", { class: "label" }, "Documents"));
  const docs = data.documents.filter((d) => d.project === p.id);
  docsPart.append(docs.length ? h("div", null, docs.map(docNode))
    : h("p", { class: "empty" }, "No documents. A folder cv/<project>/ holding a MASTER.md in an agent's home shows here."));

  const sub = p.home_of && p.home_of.length ? "The home of " + listWords(p.home_of) + "." : plural(p.agents.length, "agent") + " work here.";
  place.replaceChildren(header(p.name, sub, p.path, trail), agents, gates, cardsPart, docsPart);
}

// A worktree by the name a person knows it by: the main one, or its folder within the project.
function wtName(t) { return t.main ? "main worktree" : t.short; }

// ---------------------------------------------------------------- the map of the whole
const TILE_LIMIT = 14;   // at most 14 named children on a level

function brokenWords(words) {
  const say = { "off": ["off", "off"], "checks nothing": ["checks nothing", "check nothing"], "open": ["open", "open"], "stranded": ["stranded", "stranded"] };
  return Object.entries(words || {}).sort((a, b) => b[1] - a[1]).map(([w, n]) => n + " " + (say[w] ? say[w][n === 1 ? 0 : 1] : w)).join(", ");
}

function marks(n, below) {
  const out = [];
  if (n.waiting) out.push(h("span", { class: "marks" }, h("span", { class: "dot", "aria-hidden": "true" }), plural(n.waiting, "card") + " waiting"));
  if (n.broken) out.push(h("span", { class: "marks bad" }, h("span", { class: "mark", "aria-hidden": "true" }),
    plural(n.broken, "worktree") + (below ? " below" : "") + ": " + brokenWords(n.broken_words) + " (read)"));
  if (!n.waiting && !n.broken) out.push(h("span", { class: "marks quiet" }, "nothing waiting; no gate found broken (read)"));
  return out;
}

function tilesOf(items, make) {
  const shown = items.slice(0, TILE_LIMIT).map(make);
  const out = [h("div", { class: "tiles" }, shown)];
  if (items.length > TILE_LIMIT) {
    const d = disclosure("more:" + S.sub, plural(items.length - TILE_LIMIT, "more"));
    d.append(h("div", { class: "tiles", style: "margin-top:12px" }, items.slice(TILE_LIMIT).map(make)));
    out.push(d);
  }
  return out;
}

function nodeTile(data, n) {
  const kind = n.kind === "group" ? "group · " + plural(n.children.length, "environment")
    : n.kind === "environment" ? "home of " + listWords(n.members.map((m) => m.name)) + " · " + plural(n.projects.length, "project")
    : n.kind;
  return h("a", { class: "tile", href: "#" + mapKey() + "/" + encodeURIComponent(n.id), "data-k": "node:" + n.id },
    h("span", { class: "name" }, n.name || "(no name)"), h("span", { class: "kind" }, kind), marks(n, true));
}

function projectTile(t, home) {
  return h("a", { class: "tile", href: "#projects/" + encodeURIComponent(t.id), "data-k": "pt:" + t.id },
    h("span", { class: "name" }, t.name), h("span", { class: "kind" }, (home ? "its home · " : "project · ") + plural(t.worktrees, "worktree")),
    marks(t, false));
}

function agentTile(data, m) {
  const a = data.agents[m.agent_id] || { name: m.name, waiting: [], works: [] };
  const n = { waiting: a.waiting.length, broken: 0 };
  return h("button", { class: "tile", type: "button", "data-k": "at:" + m.agent_id, on: { click: (ev) => openDrawer("agent", { id: m.agent_id }, ev.currentTarget) } },
    h("span", { class: "name" }, a.name), h("span", { class: "kind" }, "agent · works in " + plural(a.works.length, "project")),
    n.waiting ? h("span", { class: "marks" }, h("span", { class: "dot", "aria-hidden": "true" }), plural(n.waiting, "card") + " waiting") : h("span", { class: "marks quiet" }, "nothing waiting"));
}

function fillMap() {
  const data = S.data.map;
  const place = $("place");
  const word = (S.frame && S.frame.name) || "Map";
  if (!data) { place.replaceChildren(header(word, "Reading your files…")); return; }
  if (data.off || !data.root) {
    place.replaceChildren(header(word, "The map is off: your sources file names no seats file and no map.", S.frame ? "Your sources file: " + S.frame.config : null));
    return;
  }
  const node = data.nodes[S.sub] || data.nodes[data.root];
  const chain = [];
  for (let n = node; n; n = n.parent ? data.nodes[n.parent] : null) chain.unshift(n);
  const trail = chain.length > 1 ? crumbs(...chain.slice(0, -1).map((n) => h("a", { href: "#" + mapKey() + "/" + encodeURIComponent(n.id) },
    n.kind === "whole" ? word : n.name)), node.name) : null;
  const legend = h("p", { class: "meta legend" }, h("span", { class: "dot", "aria-hidden": "true" }), "a card waits for your word below",
    h("span", { class: "mark", "aria-hidden": "true", style: "margin-left:18px" }), "a gate below is off, open, stranded or checks nothing, from a static read");
  const parts = [];
  if (node.kind === "whole") {
    const m = data.map || {};
    let line = "No map file is named in your sources file.";
    if (m.off === false) {
      line = m.places == null ? "The map file could not be summed up (see the problems above)."
        : "The map: " + plural(m.places, "place") + " and " + plural(m.edges || 0, "edge") + (m.measured ? ", measured " + day(m.measured) : ", with no date of measuring") + ".";
    }
    parts.push(header(word, line, null, trail));
    if (m.sectors && m.sectors.length) {
      const d = disclosure("map:sectors", plural(m.sectors.length, "sector") + " in the map file");
      d.append(h("ul", { class: "sectors" }, m.sectors.map((s) => h("li", null, h("span", null, s.name), h("span", { class: "meta" }, " · " + plural(s.places || 0, "place") + (s.title ? " · " + s.title : ""))))));
      parts[0].append(h("div", { style: "margin-top:8px" }, d));
    }
    const kids = node.children.map((id) => data.nodes[id]).filter(Boolean);
    // A level shows only when it has two: one group alone is opened in place, under its name.
    if (kids.length === 1 && kids[0].kind === "group") {
      const g = kids[0];
      const gk = g.children.map((id) => data.nodes[id]).filter(Boolean);
      parts.push(h("section", { class: "part" },
        h("h2", { class: "label" }, h("a", { href: "#" + mapKey() + "/" + encodeURIComponent(g.id), style: "color:inherit" }, g.name), " · " + plural(gk.length, "environment")),
        tilesOf(gk, (n) => nodeTile(data, n))));
    } else {
      parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "In it"), tilesOf(kids, (n) => nodeTile(data, n))));
    }
  } else if (node.kind === "group") {
    parts.push(header(node.name, "A group of " + plural(node.members.length, "agent") + ", in " + plural(node.children.length, "environment") + ".", null, trail));
    const kids = node.children.map((id) => data.nodes[id]).filter(Boolean);
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Environments"), tilesOf(kids, (n) => nodeTile(data, n))));
    const homeless = node.members.filter((m) => !kids.some((k) => k.members.some((x) => x.agent_id === m.agent_id)));
    if (homeless.length) parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Agents with no home folder"), tilesOf(homeless, (m) => agentTile(data, m))));
  } else {
    parts.push(header(node.name, "An environment: " + listWords(node.members.map((m) => m.name + "'s home")) + ".", node.path, trail));
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Members"), tilesOf(node.members, (m) => agentTile(data, m))));
    const tiles = node.projects.map((id) => data.projects[id]).filter(Boolean);
    parts.push(h("section", { class: "part" }, h("h2", { class: "label" }, "Works in"),
      tiles.length ? tilesOf(tiles, (t) => projectTile(t, t.id === node.project_id)) : h("p", { class: "empty" }, "No project lists its members.")));
  }
  parts.push(legend);
  place.replaceChildren(...parts);
}

// ---------------------------------------------------------------- the Record
const R = {};

function mountRecord() {
  R.head = h("div");
  R.search = h("input", { class: "input search", type: "search", placeholder: "Search your decisions", "aria-label": "Search your decisions",
    value: S.q.record, "data-k": "search:record" });
  R.search.addEventListener("input", () => { S.q.record = R.search.value; fill(); });
  R.facets = h("div", { class: "seg", role: "group", "aria-label": "Status" });
  R.tools = h("div", { class: "tools" }, R.search, R.facets);
  R.list = h("div");
  R.empty = h("p", { class: "empty", hidden: true });
  $("place").replaceChildren(R.head, R.tools, R.list, R.empty);
}

function entryText(e) {
  return [e.id, e.date, e.to, e.subject, e.words, e.offer, e.reading, e.source, e.computed_status,
    ...(e.notes || []).flatMap((n) => [n.text, n.quote, n.source])].filter(Boolean).join("\n").toLowerCase();
}

function statusWord(s) { return h("span", { class: "state-word" + (s === "superseded" || s === "parked" ? " quiet" : "") }, s || "no status"); }

function entryNode(e, withSubject) {
  const node = h("div", { class: "entry", "data-entry": e.id, "data-k": "entry:" + e.id, tabindex: "-1" });
  if (withSubject) node.append(h("h2", { class: "subject" }, e.subject || "(no subject)"));
  const stored = e.stored_status && e.stored_status !== e.computed_status ? " (stored as " + e.stored_status + ")" : "";
  node.append(h("p", { class: "meta" }, h("span", { class: "mono" }, e.id), " · " + day(e.date) + " · ", statusWord(e.computed_status), stored + (e.to ? " · to " + e.to : "")));
  node.append(h("blockquote", { class: "words" }, e.words || "(no words recorded)"));
  const facts = h("dl", { class: "facts" });
  if (e.offer) facts.append(h("dt", null, "Offer"), h("dd", { class: "soft" }, e.offer));
  if (e.reading) facts.append(h("dt", null, "Reading"), h("dd", { class: "soft" }, e.reading));
  if (facts.childNodes.length) node.append(facts);
  node.append(h("p", { class: "pin", title: "Where your words were first written down" }, e.source || "no source pinned"));
  const rel = h("p", { class: "rel" });
  const links = (ids) => ids.map((id, i) => [i ? ", " : "", h("a", { href: "#record/" + encodeURIComponent(id) }, id)]);
  if (e.supersedes && e.supersedes.length) rel.append(h("span", null, "Supersedes ", links(e.supersedes)));
  if (e.superseded_by && e.superseded_by.length) rel.append(h("span", null, "Superseded by ", links(e.superseded_by)));
  if (rel.childNodes.length) node.append(rel);
  for (const n of e.notes || []) {
    node.append(h("div", { class: "note" }, h("p", { class: "label" }, "Note"), h("p", { class: "soft" }, n.text || ""),
      n.quote ? h("blockquote", { class: "words" }, n.quote) : null, h("p", { class: "pin" }, n.source || "")));
  }
  return node;
}

function fillRecord() {
  const data = S.data.record;
  if (!data) { R.head.replaceChildren(header("Record", "Reading your files…")); return; }
  if (data.off) {
    R.head.replaceChildren(header("Record", "The record is off: your sources file names no register.", S.frame ? "Your sources file: " + S.frame.config : null));
    R.tools.hidden = true;
    R.list.replaceChildren();
    return;
  }
  R.tools.hidden = false;
  const counts = data.counts || {};
  const by = counts.by_status || {};
  R.head.replaceChildren(header("Record", plural(counts.entries || 0, "decision") + " in " + plural(counts.threads || 0, "thread") + ", newest first. Your words are kept as you gave them.",
    data.files && data.files.register ? "From " + data.files.register + (data.notes_off ? "" : ", with its notes") + "." : null));
  const facets = [["all", "All", counts.entries || 0], ...Object.entries(by).filter(([, n]) => n > 0).map(([s, n]) => [s, cap(s), n])];
  if (!facets.some(([k]) => k === S.facet)) S.facet = "all";
  R.facets.replaceChildren(...facets.map(([k, label, n]) => h("button", { type: "button", "aria-pressed": String(S.facet === k), "data-k": "facet:" + k,
    on: { click: () => { S.facet = k; fill(); } } }, label, h("span", { class: "n" }, String(n)))));
  const q = S.q.record.trim().toLowerCase();
  const byId = new Map((data.entries || []).map((e) => [e.id, e]));
  const fits = (e) => (S.facet === "all" || e.computed_status === S.facet) && (!q || entryText(e).includes(q));
  const out = [];
  let shown = 0;
  for (const t of data.threads || []) {
    const ents = (t.entries || []).map((id) => byId.get(id)).filter((e) => e && fits(e)).reverse();
    if (!ents.length) continue;
    shown += ents.length;
    const art = h("article", { class: "thread" });
    if ((t.entries || []).length > 1) {
      art.append(h("h2", { class: "subject" }, t.subject || "(no subject)"),
        h("p", { class: "meta" }, plural(t.entries.length, "decision") + " · now " + (t.current || "no status") + ((t.to || []).length ? " · to " + t.to.join(", ") : "")
          + " · " + (t.first === t.last ? day(t.last) : day(t.first) + " to " + day(t.last))));
      for (const e of ents) art.append(entryNode(e, false));
    } else art.append(entryNode(ents[0], true));
    out.push(art);
  }
  R.list.replaceChildren(...out);
  R.empty.hidden = shown !== 0;
  R.empty.textContent = q ? "No decision matches “" + S.q.record.trim() + "”" + (S.facet !== "all" ? " among those " + S.facet : "") + "." : "No decision has this status.";
  applyTarget("record", "data-entry");
}

// ---------------------------------------------------------------- drawers
function openDrawer(kind, arg, opener) {
  S.drawer = { kind, arg: arg || {} };
  S.opener = opener || document.activeElement;
  $("drawer").hidden = false;
  $("scrim").hidden = false;
  renderDrawer(true);
  $("drawer-close").focus();
  const route = DRAWER_ROUTE[kind];
  if (!S.data[route]) load(route).then(() => renderDrawer(false)).catch((e) => { S.err = String(e.message || e); renderProblems(); });
}

function closeDrawer(quiet) {
  if (!S.drawer) return;
  S.drawer = null;
  $("drawer").hidden = true;
  $("scrim").hidden = true;
  const back = S.opener;
  S.opener = null;
  if (quiet) return;
  if (back && document.contains(back)) back.focus();
  else if (back && back.dataset && back.dataset.k) {
    const again = document.querySelector('[data-k="' + CSS.escape(back.dataset.k) + '"]');
    (again || $("main")).focus();
  } else $("main").focus();
}

function drawerPart(label, ...kids) { return h("section", { class: "part" }, h("h3", { class: "label" }, label), ...kids); }

function renderDrawer(fresh) {
  if (!S.drawer) return;
  const body = $("drawer-body");
  const y = body.scrollTop;
  const { kind, arg } = S.drawer;
  const data = S.data[DRAWER_ROUTE[kind]];
  $("drawer-kind").textContent = { agent: "Agent", rules: "Rules", gates: "Gates", docs: "Documents" }[kind];
  if (!data) { $("drawer-title").textContent = "Reading…"; body.replaceChildren(); return; }
  const parts = (DRAW[kind] || (() => ["", []]))(data, arg);
  $("drawer-title").textContent = parts[0];
  body.replaceChildren(...parts[1]);
  if (!fresh) body.scrollTop = y;
}

const DRAW = {
  agent(data, arg) {
    const id = arg.id || (data.names || {})[arg.name];
    const a = data.agents[id];
    if (!a) return [arg.name || "No such agent", [h("p", { class: "empty" }, "This agent is not in your seats file now.")]];
    const facts = h("dl", { class: "facts" });
    const add = (k, v) => { if (v) facts.append(h("dt", null, k), h("dd", null, v)); };
    add("Also called", (a.other_names || []).join(", "));
    add("Groups", (a.groups || []).join(", "));
    add("Emails", (a.emails || []).join(", "));
    if (a.home) facts.append(h("dt", null, "Home"), h("dd", { class: "mono" }, a.home));
    const go = (href) => (ev) => { closeDrawer(true); if (location.hash === href) ev.preventDefault(); };
    const works = a.works.length ? h("div", { class: "alist" }, a.works.map((w) => h("div", { class: "arow" },
      h("a", { href: "#projects/" + encodeURIComponent(w.project_id), on: { click: go("#projects/" + w.project_id) } }, w.name),
      h("span", { class: "soft" }, basisWords(w))))) : h("p", { class: "empty" }, "No project lists this agent.");
    const waiting = a.waiting.map((k) => data.cards[k]).filter(Boolean);
    const cardsList = waiting.length ? h("div", { class: "alist" }, newestFirst(waiting).map((c) => h("div", { class: "arow" },
      h("button", { class: "link mono", type: "button", on: { click: () => goCard(c.key) } }, c.id),
      h("span", null, c.title), h("span", { class: "meta" }, when(c.at)))))
      : h("p", { class: "empty" }, "Nothing from " + a.name + " waits for your word" + (a.cards ? "; " + plural(a.cards, "card") + " in all." : "."));
    const docs = (data.documents || []).filter((d) => a.documents.includes(d.id));
    const docList = docs.length ? h("div", { class: "alist" }, docs.map((d) => h("div", { class: "arow" },
      d.project ? h("button", { class: "link", type: "button", on: { click: (ev) => openDrawer("docs", { project: d.project, doc: d.id }, ev.currentTarget) } }, d.title || d.slug) : h("span", null, d.title || d.slug),
      h("span", { class: "meta" }, "cv/" + d.slug + " · " + when(d.updated)))))
      : h("p", { class: "empty" }, "No documents in " + a.name + "'s cv folder.");
    const r = a.rules || { environments: [] };
    const rules = h("div", { class: "alist" },
      h("p", { class: "soft" }, r.environments.length ? "Its own: " + r.environments.join(", ") + ". Every other environment is shared." : "No environment of its own; it reads the shared ones."),
      h("button", { class: "link", type: "button", on: { click: (ev) => openDrawer("rules", { agent: a.name }, ev.currentTarget) } }, "Open " + a.name + "'s rules"));
    return [a.name, [h("section", { class: "part" }, facts), drawerPart("Works in", works), drawerPart("Waiting", cardsList),
      drawerPart("Documents", docList), drawerPart("Rules", rules)]];
  },

  rules(data, arg) {
    if (data.off) return ["Rules", [h("p", { class: "empty" }, "Rules are off: your sources file names no folder of rule cards.")]];
    const envs = data.environments || [];
    const agent = arg.agent;
    const owned = new Set(Object.values(data.agents || {}).flatMap((x) => x.environments || []));
    let chosen = envs;
    let lead = "";
    if (agent && data.agents && data.agents[agent]) {
      const mine = data.agents[agent].environments || [];
      chosen = [...envs.filter((e) => mine.includes(e.name)), ...envs.filter((e) => !owned.has(e.name))];
      lead = (mine.length ? "Its own environment" + (mine.length > 1 ? "s" : "") + " first (" + Object.values(data.agents[agent].basis || {}).join("; ") + "), then the shared ones." : "It has no environment of its own; these are the shared ones.");
    }
    const c = data.counts || {};
    const parts = [h("section", { class: "part" },
      h("p", { class: "soft" }, plural(c.rules || 0, "rule") + " in " + plural(c.environments || 0, "environment") + ": " + (c.written || 0) + " written, " + (c.checked || 0) + " checked, " + (c.guarded || 0) + " guarded."),
      lead ? h("p", { class: "meta", style: "margin-top:4px" }, lead) : null,
      h("p", { class: "meta", style: "margin-top:4px" }, "How firmly each is held: written, its words alone; checked, a correction kept as a test is tied to it; guarded, its card records a guard."))];
    for (const e of chosen) {
      const env = h("div", { class: "env" },
        h("p", { class: "env-head" }, e.title || e.name),
        h("p", { class: "meta" }, [e.name, e.version ? "version " + e.version : null, e.status, e.ratified_by ? "ratified by " + e.ratified_by : null,
          owned.has(e.name) ? null : "shared"].filter(Boolean).join(" · ")));
      if (e.scope) env.append(h("p", { class: "soft", style: "margin-top:4px" }, e.scope));
      const rules = e.rules || [];
      if (!rules.length) env.append(h("p", { class: "empty" }, "No rules in this environment yet."));
      const kinds = new Map();
      for (const r of rules) { const k = r.kind || "other"; if (!kinds.has(k)) kinds.set(k, []); kinds.get(k).push(r); }
      for (const [k, list] of kinds) {
        env.append(h("p", { class: "label kind-head" }, k + " · " + list.length));
        for (const r of list) {
          env.append(h("div", { class: "rule" }, h("p", null, r.words),
            h("p", { class: "meta" }, h("span", { class: "mono" }, r.id), " · ",
              h("span", { class: "tip", title: r.held === "checked" ? "Tied to " + (r.cases || []).join(", ") : r.held === "guarded" ? "Guarded by " + (r.guards || []).join("; ") : "Its words alone" }, r.held || "written"),
              r.agent ? " · " + r.agent + " only" : "", r.live === false ? " · switched off" : "", r.candidate ? " · not ratified" : "")));
        }
      }
      parts.push(env);
    }
    return [agent ? agent + "'s rules" : "Your rules", parts];
  },

  gates(data, arg) {
    const p = (data.projects || []).find((x) => x.id === arg.project);
    if (!p) return ["No such project", [h("p", { class: "empty" }, "No project in your seats file has this id now.")]];
    const trees = p.gates.worktrees;
    if (!trees.length) return [p.name, [h("p", { class: "empty" }, "No worktree was read here.")]];
    const rank = (t) => Math.min(...t.words.map((w) => ["off", "checks nothing", "open", "stranded", "unknown", "folder gone"].indexOf(w)).map((i) => i < 0 ? 9 : i));
    const t = trees.find((x) => x.path === arg.path) || trees.slice().sort((a, b) => rank(a) - rank(b))[0];
    const parts = [];
    if (trees.length > 1) {
      parts.push(h("div", { class: "switcher", role: "group", "aria-label": "Worktrees" }, trees.map((x) => h("button", { type: "button", "aria-pressed": String(x === t),
        on: { click: () => { S.drawer.arg = { project: p.id, path: x.path }; renderDrawer(false); } } }, h("span", { class: "mono" }, wtName(x)), stateWords(x)))));
    }
    parts.push(h("section", { class: "part" }, h("p", null, h("span", { class: "mono" }, t.path)), h("p", { style: "margin-top:4px" }, stateWords(t)),
      data.read_note ? h("p", { class: "meta", style: "margin-top:4px" }, "From " + data.read_note + ".") : null));
    parts.push(h("section", { class: "part" }, h("div", { class: "wt-body", style: "padding:0" }, worktreeDetail(t))));
    parts.push(h("section", { class: "part" }, h("a", { href: "#projects/" + encodeURIComponent(p.id), on: { click: () => closeDrawer(true) } }, "Open " + p.name)));
    return [p.name, parts];
  },

  docs(data, arg) {
    const p = (data.projects || []).find((x) => x.id === arg.project);
    if (!p) return ["No such project", [h("p", { class: "empty" }, "No project in your seats file has this id now.")]];
    const docs = (data.documents || []).filter((d) => d.project === p.id);
    const parts = [h("section", { class: "part" }, h("p", { class: "soft" }, docs.length ? plural(docs.length, "document") + " in " + p.name + ", each a cv folder holding a MASTER.md. Reading one here comes next; your inbox's Documents opens them today." : "No documents here."))];
    if (docs.length) parts.push(h("section", { class: "part" }, docs.map(docNode)));
    return [p.name, parts];
  },
};

// ---------------------------------------------------------------- start
$("drawer-close").addEventListener("click", () => closeDrawer());
$("scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && S.drawer) { ev.preventDefault(); closeDrawer(); } });
$("skip").addEventListener("click", (ev) => { ev.preventDefault(); $("main").focus(); });
window.addEventListener("hashchange", () => { closeDrawer(true); route(); });
window.addEventListener("focus", () => refresh());
setInterval(refresh, 10000);

(async function start() {
  await route();
  // A drawer can be opened from the address: ?open=agent:<id or name>, rules, rules:<agent>, gates:<project id>, docs:<project id>.
  const open = new URLSearchParams(location.search).get("open");
  if (open) {
    const cut = open.indexOf(":");
    const kind = cut < 0 ? open : open.slice(0, cut);
    const arg = cut < 0 ? "" : open.slice(cut + 1);
    if (kind === "agent") openDrawer("agent", /^[0-9a-f]{10}$/.test(arg) ? { id: arg } : { name: arg });
    else if (kind === "rules") openDrawer("rules", arg ? { agent: arg } : {});
    else if (kind === "gates" || kind === "docs") openDrawer(kind, { project: arg });
  }
})();
</script>
</body>
</html>
