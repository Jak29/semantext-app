<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantext</title>
<style>
/* The page in four places, quiet by design (DESIGN.md has the reasons): neutral greys carry every surface, line and
   word; gold marks only where your word waits or where you act; red marks only what is broken. Four sizes (32, 24, 15,
   12) and two weights. Nothing here loads from the network. */
:root {
  color-scheme: light;
  --bg: #fafaf9;
  --surface: #f1f1ef;
  --raised: #ffffff;
  --line: #e6e6e2;
  --line-2: #d3d3ce;
  --text: #1b1b19;
  --text-2: #5a5a55;
  --text-3: #6f6f69;
  --accent: #b9831c;
  --accent-ink: #8a5f0b;
  --on-accent: #1d1503;
  --danger: #c2412d;
  --scrim: rgba(20, 20, 18, .22);
  --shadow: 0 12px 32px rgba(20, 20, 18, .14);
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1b1b1a; --raised: #222220; --line: #2a2a28; --line-2: #3b3b38;
    --text: #ececea; --text-2: #a6a6a0; --text-3: #80807a;
    --accent: #e8b553; --accent-ink: #e8b553; --on-accent: #1d1503; --danger: #f0705f;
    --scrim: rgba(0, 0, 0, .45); --shadow: 0 16px 40px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1b1b1a; --raised: #222220; --line: #2a2a28; --line-2: #3b3b38;
  --text: #ececea; --text-2: #a6a6a0; --text-3: #80807a;
  --accent: #e8b553; --accent-ink: #e8b553; --on-accent: #1d1503; --danger: #f0705f;
  --scrim: rgba(0, 0, 0, .45); --shadow: 0 16px 40px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--ui); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 16px; top: -48px; padding: 6px 12px; background: var(--raised); border: 1px solid var(--line-2); border-radius: 8px; z-index: 20; }
.skip:focus { top: 10px; }
.mono { font-family: var(--mono); font-size: 12px; }
.meta { font-size: 12px; line-height: 1.5; color: var(--text-3); }
.soft { color: var(--text-2); }
.bad { color: var(--danger); }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }

/* ---------------- the bar: four places, one click each ---------------- */
.bar { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 56px; padding: 8px 24px;
  background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { font-weight: 600; }
.places { display: flex; flex-wrap: wrap; gap: 4px; }
.places a { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 8px; color: var(--text-2); text-decoration: none; }
.places a:hover { color: var(--text); background: var(--surface); }
.places a[aria-current="page"] { color: var(--text); background: var(--surface); font-weight: 600; }
.places .n { color: var(--accent-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
/* the place's own tools, in the bar: on Waiting, its sentence, the search and By project */
.bar-place { display: flex; flex: 1 1 auto; min-width: 0; }
.bar-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
.bar-tools .say { font-size: 12px; color: var(--text-2); }
.bar-tools .search { flex: 0 1 220px; height: 32px; min-width: 120px; }
.toggle.small { height: 30px; padding: 0 10px; font-size: 12px; }
.bar-end { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.checked { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.gaming { font-size: 12px; font-weight: 600; color: var(--accent-ink); white-space: nowrap; }
.gaming.unknown { font-weight: 400; color: var(--text-3); }
.quiet-count { border: 0; background: none; padding: 2px 0; font-size: 12px; color: var(--danger); white-space: nowrap; text-decoration: underline dotted; text-underline-offset: 3px; }
.quiet-count[aria-expanded="true"] { text-decoration-style: solid; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* ---------------- a place ---------------- */
main { max-width: 840px; margin: 0 auto; padding: 32px 32px 96px; }
main.wide { max-width: 1120px; }
main:focus { outline: none; }
.head { margin: 8px 0 28px; }
h1 { font-size: 32px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
.sub { color: var(--text-2); margin-top: 8px; max-width: 72ch; }
.head .meta { margin-top: 6px; }
.crumbs { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.crumbs a { color: var(--text-2); }
.part + .part { margin-top: 40px; }
.part > .label { display: block; margin-bottom: 12px; }
.empty { color: var(--text-2); padding: 4px 0; }
.empty + .holds, .holds { color: var(--text-3); margin-top: 6px; max-width: 72ch; }

/* the problems banner */
.problems { margin: 0 0 28px; padding: 12px 16px; border: 1px solid var(--danger); border-radius: 12px; }
.problems-title { font-weight: 600; }
.problems ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.problems li { display: grid; gap: 1px; }
.problems .pwhere { font: 12px/1.5 var(--mono); color: var(--text-3); overflow-wrap: anywhere; }
.problems details { margin-top: 8px; }
.problems details.problems-fold { margin-top: 0; }
.problems-fold > summary { color: var(--text); }
.problems-fold > summary::before { color: var(--danger); }

/* controls */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 0 20px; }
.input { height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); min-width: 0; }
.input:focus { border-color: var(--text-3); }
.search { flex: 1 1 260px; max-width: 420px; }
.toggle { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); white-space: nowrap; }
.toggle:hover { border-color: var(--text-3); color: var(--text); }
.toggle[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; color: var(--text-2); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
.seg .n { font-variant-numeric: tabular-nums; color: var(--text-3); margin-left: 6px; font-weight: 400; }
.link { border: 0; background: none; padding: 0; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); text-align: left; }
.link:hover { color: var(--text); text-decoration-color: currentColor; }
details > summary { cursor: pointer; list-style: none; color: var(--text-2); }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: "+ "; color: var(--text-3); }
details[open] > summary::before { content: "\2013  "; }

/* ---------------- a card, as your inbox shows it ---------------- */
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid transparent; border-radius: 12px; padding: 14px 18px; scroll-margin-top: 80px; }
.card.is-waiting { border-left: 3px solid var(--accent); border-radius: 4px 12px 12px 4px; }
.card.is-done, .card.is-parked { background: transparent; border-color: var(--line); }
.card.is-parked { border-style: dashed; }
.card:focus { outline: none; }
.card.target { box-shadow: 0 0 0 2px var(--accent); }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.at { margin-left: auto; font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2);
  font-size: 12px; font-weight: 600; line-height: 1.5; white-space: nowrap; text-decoration: none; }
.chip.seat { color: var(--text); }
.chip.kind { border-color: transparent; background: var(--bg); }
.card.is-done .chip.kind, .card.is-parked .chip.kind { background: var(--surface); }
button.chip:hover, a.chip:hover { border-color: var(--text-3); color: var(--text); }
button.id { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raised); color: var(--text); font: 600 12px/1.5 var(--mono); cursor: copy; }
button.id:hover { border-color: var(--accent); }
.card-title { margin: 8px 0 4px; font-size: 15px; font-weight: 600; text-wrap: balance; overflow-wrap: anywhere; }
.why { overflow-wrap: anywhere; }
.question { margin: 10px 0 4px; font-weight: 600; }
.options { margin: 0; padding-left: 22px; }
.options li + li { margin-top: 2px; }
.where, .closed, .status { margin: 10px 0 0; font-size: 12px; color: var(--text-2); }
.park { margin: 4px 0 0; font-size: 12px; color: var(--text-3); }
.refused { margin: 10px 0 0; font-size: 12px; color: var(--danger); }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 10px 0 0; }
.facts dt { font-size: 12px; color: var(--text-3); padding-top: 3px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
pre.command { margin: 10px 0 0; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }
.more, .output { margin-top: 8px; }
.more > summary, .output > summary { font-size: 12px; }
.more-body { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.who { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.tip { text-decoration: underline dotted; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: help; }
pre.out, pre.err { margin-top: 6px; }
pre.err { border-color: var(--danger); }
.said { margin-top: 10px; }
.said .meta a { color: var(--text-2); }
blockquote.words { margin: 4px 0 0; padding: 1px 0 1px 12px; border-left: 2px solid var(--line-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.group-head { margin: 24px 0 10px; }
.group-head:first-child { margin-top: 0; }
.shelf { margin-top: 28px; }
.shelf > summary { font-weight: 600; padding: 6px 0; }
.shelf > .cards, .shelf > .shelf-note { margin-top: 12px; }
.shelf-note { font-size: 12px; color: var(--text-3); }
.shelf-note a { color: var(--text-2); }

/* ---------------- projects ---------------- */
.rows { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(220px, 2fr) minmax(190px, 1.3fr) minmax(90px, .6fr) minmax(110px, .7fr);
  gap: 16px; align-items: start; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.prow.head-row { padding: 10px 4px; }
.pname a { font-weight: 600; text-decoration: none; }
.pname a:hover { text-decoration: underline; }
.ppath { font: 12px/1.5 var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cellbtn { display: grid; gap: 1px; text-align: left; border: 0; background: none; padding: 0; color: inherit; }
.cellbtn:hover .w { text-decoration: underline; text-underline-offset: 3px; }
.cellbtn .meta { font-size: 12px; }
.none { color: var(--text-3); }
.dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
.mark { display: inline-block; flex: none; width: 9px; height: 9px; border: 2px solid var(--danger); border-radius: 2px; margin-right: 8px; vertical-align: 0; }
.goldtext { color: var(--accent-ink); font-weight: 600; }
.alist { display: grid; gap: 10px; }
.arow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.wts { border-top: 1px solid var(--line); }
.wt { border-bottom: 1px solid var(--line); }
.wt > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 2px; }
.wt > summary .mono { color: var(--text); font-size: 12px; overflow-wrap: anywhere; }
.wt > summary::before { flex: none; }
.words-row { display: inline-flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
.wt-body { padding: 4px 2px 18px 18px; display: grid; gap: 10px; }
table.events { border-collapse: collapse; width: 100%; max-width: 680px; }
table.events th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); font-weight: 600; padding: 0 14px 6px 0; border-bottom: 1px solid var(--line); }
table.events td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
table.events td.mono { white-space: nowrap; }
.doc { padding: 12px 0; border-bottom: 1px solid var(--line); }
.doc:first-child { border-top: 1px solid var(--line); }
.doc ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------------- documents, read in the page ---------------- */
.docrows { display: grid; gap: 12px; }
.docrow { display: grid; gap: 4px; padding: 14px 18px; border-radius: 12px; background: var(--surface); color: inherit; text-decoration: none; }
.docrow:hover { box-shadow: 0 0 0 1px var(--line-2); }
.doc-tools { display: flex; gap: 10px; margin: 0 0 16px; }
.doc-tools button { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--accent); background: transparent; color: var(--accent-ink); font-weight: 600; }
.doc-tools button:disabled { opacity: .5; cursor: default; }
textarea.copy-box { width: 100%; min-height: 160px; margin-top: 12px; font: 12px/1.5 var(--mono); background: var(--raised); color: var(--text); border: 1px solid var(--line-2); border-radius: 8px; }
.md { overflow-wrap: anywhere; }
.md > * + * { margin-top: 12px; }
.md h2, .md h3, .md h4, .md h5, .md h6 { margin: 24px 0 0; line-height: 1.3; font-weight: 600; }
.md h2 { font-size: 24px; }
.md h3 { font-size: 15px; }
.md h4, .md h5, .md h6 { font-size: 15px; color: var(--text-2); }
.md p { margin: 12px 0 0; }
.md ul, .md ol { margin: 12px 0 0; padding-left: 22px; }
.md blockquote { margin: 12px 0 0; padding: 1px 0 1px 12px; border-left: 2px solid var(--line-2); color: var(--text-2); }
.md pre { margin: 12px 0 0; padding: 8px 10px; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; font: 12px/1.65 var(--mono); white-space: pre-wrap; overflow: auto; }
.md code { font: 12px var(--mono); padding: 0 4px; border-radius: 4px; background: var(--surface); }
.md pre code { padding: 0; background: none; }
.problems:focus { outline: none; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0 0; }
.md-table-wrap { overflow-x: auto; margin-top: 12px; }
.md table { border-collapse: collapse; }
.md th, .md td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.md th { font-size: 12px; color: var(--text-3); font-weight: 600; }
.md-figure { margin: 12px 0 0; }
/* a diagram keeps its own light ground, so a dark-lined drawing reads in both themes */
.md-figure img { display: block; max-width: 100%; height: auto; padding: 12px; border-radius: 8px; background: #ffffff; border: 1px solid var(--line); }
.md-figure figcaption { margin-top: 6px; }
.md + .part { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }

/* ---------------- the map ---------------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; align-content: start; min-height: 116px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--bg); color: inherit; text-decoration: none; text-align: left; }
.tile:hover { border-color: var(--line-2); background: var(--surface); }
.tile .name { font-weight: 600; overflow-wrap: anywhere; }
.tile .kind { font-size: 12px; color: var(--text-3); }
.marks { display: flex; align-items: baseline; font-size: 12px; color: var(--text-2); }
.marks.bad { color: var(--danger); }
.marks.quiet { color: var(--text-3); }
.sectors { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.legend { margin-top: 28px; display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 4px; }

/* ---------------- the record ---------------- */
.thread { padding: 18px 0; border-bottom: 1px solid var(--line); }
.thread:first-child { border-top: 1px solid var(--line); }
a.threadrow { display: grid; gap: 2px; padding: 14px 0; color: inherit; text-decoration: none; }
a.threadrow:hover .subject { text-decoration: underline; text-underline-offset: 3px; }
.subject { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.entry { margin-top: 8px; border-radius: 4px; scroll-margin-top: 90px; }
.entry + .entry { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-2); }
.entry:focus { outline: none; }
.entry.target { box-shadow: 0 0 0 2px var(--accent); }
.entry .meta { margin-top: 2px; }
.entry .words { margin-top: 8px; }
.pin { font: 12px/1.5 var(--mono); color: var(--text-3); margin-top: 8px; overflow-wrap: anywhere; }
.rel { font-size: 12px; color: var(--text-3); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.rel a { color: var(--text-2); font-family: var(--mono); }
.note { margin: 10px 0 0 4px; padding-left: 12px; border-left: 1px solid var(--line-2); }
.state-word { color: var(--text-2); }
.state-word.quiet { color: var(--text-3); }

/* ---------------- drawers ---------------- */
.scrim { position: fixed; inset: 0; z-index: 8; background: var(--scrim); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 9; width: min(560px, 100vw); display: flex; flex-direction: column;
  background: var(--raised); border-left: 1px solid var(--line); box-shadow: var(--shadow); }
.drawer-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 18px 24px 16px; border-bottom: 1px solid var(--line); }
.drawer-head h2 { font-size: 24px; line-height: 1.25; font-weight: 600; overflow-wrap: anywhere; }
.drawer-head .label { grid-column: 1; }
.drawer-head h2 { grid-column: 1; }
.close { grid-column: 2; grid-row: 1 / span 2; align-self: start; width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2); }
.close:hover { color: var(--text); border-color: var(--text-3); }
.drawer-body { overflow: auto; padding: 18px 24px 48px; }
.drawer-body .part + .part { margin-top: 28px; }
.drawer-body .facts { margin-top: 0; }
.rule { padding: 10px 0; border-bottom: 1px solid var(--line); }
.rule:first-of-type { border-top: 1px solid var(--line); }
.rule .meta { margin-top: 3px; }
.kind-head { margin: 18px 0 8px; }
.env { margin-top: 28px; }
.env + .env { padding-top: 20px; border-top: 1px solid var(--line-2); }
.env-head { font-weight: 600; }
.switcher { display: grid; gap: 6px; margin-bottom: 16px; }
.switcher button { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; }
.switcher button[aria-pressed="true"] { background: var(--surface); border-color: var(--line-2); }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 12; transform: translateX(-50%); padding: 9px 18px; border-radius: 999px; background: var(--text); color: var(--bg); }

@media (max-width: 900px) {
  .prow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .prow.head-row { display: none; }
}
@media (max-width: 720px) {
  .bar { gap: 6px 12px; padding: 10px 16px; }
  .bar-place { flex-basis: 100%; }
  .bar-end { margin-left: 0; width: 100%; }
  main, main.wide { padding: 20px 16px 72px; }
  .prow { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  h1 { font-size: 24px; }
  .wt-body { padding-left: 2px; }
}
@media (prefers-reduced-motion: no-preference) {
  .drawer { animation: drawer-in .16s ease-out; }
  @keyframes drawer-in { from { transform: translateX(12px); opacity: .7; } }
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to the content</a>
<header class="bar">
  <span class="brand">Semantext</span>
  <nav class="places" aria-label="Places">
    <a data-place="waiting" href="#waiting" id="tab-waiting">Waiting <span class="n" id="count-waiting"></span></a>
    <a data-place="projects" href="#projects" id="tab-projects">Projects</a>
    <a data-place="documents" href="#documents" id="tab-documents">Documents</a>
    <a data-place="map" href="#map" id="tab-map">Map</a>
    <a data-place="record" href="#record" id="tab-record">Record</a>
  </nav>
  <div class="bar-place" id="bar-place"></div>
  <div class="bar-end">
    <span class="gaming" id="gaming" role="status" hidden></span>
    <button class="quiet-count" id="problems-count" type="button" aria-expanded="false" aria-controls="problems" hidden></button>
    <span class="checked" id="checked" role="status">Reading your files…</span>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="problems" id="problems" aria-label="Problems" tabindex="-1" hidden></section>
  <div id="place"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <p class="label" id="drawer-kind"></p>
    <h2 id="drawer-title" tabindex="-1"></h2>
    <button class="close" id="drawer-close" type="button" aria-label="Close" title="Close (Esc)">&#x2715;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
// Every piece of the person's text is set as text: elements are made with createElement, and words go in as text
// nodes, never parsed as markup. The page only reads: it sends the X-Semantext header with every read, runs nothing,
// and writes nothing anywhere.

const $ = (id) => document.getElementById(id);
const PROPS = new Set(["open", "hidden", "type", "value", "disabled", "checked", "tabIndex", "placeholder"]);

function h(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k === "on") for (const [type, fn] of Object.entries(v)) node.addEventListener(type, fn);
    else if (PROPS.has(k)) node[k] = v;
    else node.setAttribute(k, v === true ? "" : String(v));
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : String(kid));
  }
  return node;
}

// ---------------------------------------------------------------- words and times
const plural = (n, one, many) => n + " " + (n === 1 ? one : (many || one + "s"));
const stamp = (iso) => { const t = Date.parse(iso); return Number.isNaN(t) ? 0 : t; };
function when(iso) {
  const d = new Date(iso);
  if (!iso || Number.isNaN(d.getTime())) return iso || "";
  return d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function day(date) {
  if (!date) return "";
  const d = new Date(String(date).slice(0, 10) + "T12:00:00");
  return Number.isNaN(d.getTime()) ? String(date) : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
const clock = () => new Date().toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function listWords(items) {
  const xs = items.filter(Boolean);
  return xs.length <= 1 ? (xs[0] || "") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
}
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
// A long path by its last two folders, which tell paths apart; the whole path goes in the tooltip.
function tail(path) {
  const parts = String(path || "").split(/[\\/]+/).filter(Boolean);
  const sep = String(path || "").includes("\\") ? "\\" : "/";
  return parts.length > 3 ? "…" + sep + parts.slice(-2).join(sep) : String(path || "");
}
// Breadcrumbs: each piece in its own box, so the separators keep their space.
function crumbs(...pieces) {
  const nav = h("nav", { class: "crumbs", "aria-label": "Where you are" });
  pieces.forEach((p, i) => { if (i) nav.append(h("span", { "aria-hidden": "true" }, "›")); nav.append(p instanceof Node ? p : h("span", null, p)); });
  return nav;
}
// Cards newest first, as the inbox orders them; a tie keeps the order the files give.
const newestFirst = (list) => list.slice().sort((a, b) => stamp(b.at) - stamp(a.at));

// ---------------------------------------------------------------- the state of the page
const S = {
  place: null, sub: null, mounted: null,
  data: {}, sig: {}, frame: null, err: null, busy: false,
  open: new Set(), q: { waiting: "", record: "" }, facet: "all", byProject: false, problemsOpen: false,
  drawer: null, opener: null,
  target: null,   // { place, key, focused }: the card or decision a link pointed at, marked until you go elsewhere
};

// Mark the element a link pointed at: on every drawing while you stay, and brought into view and focused once.
function applyTarget(place, attr) {
  const t = S.target;
  if (!t || t.place !== place) return;
  const el = document.querySelector("[" + attr + '="' + CSS.escape(t.key) + '"]');
  if (!el) return;
  el.classList.add("target");
  if (!t.focused) { t.focused = true; S.moved = true; el.scrollIntoView({ block: "center" }); el.focus({ preventScroll: true }); }
}
const ROUTE = { waiting: "waiting", projects: "projects", documents: "documents", map: "map", record: "record" };
const DRAWER_ROUTE = { agent: "map", rules: "rules", gates: "projects", docs: "projects" };
const READER = { waiting: "Waiting", record: "Record", rules: "Rules", gates: "Gates", places: "Places", sources: "Sources", page: "This page" };
const BROKEN = new Set(["off", "checks nothing", "open", "stranded"]);

async function get(route) {
  const r = await fetch("/api/v2/" + route, { headers: { "X-Semantext": "1" }, cache: "no-store" });
  if (!r.ok) {
    let why = "the server answered " + r.status;
    try { why = (await r.json()).error || why; } catch (e) { /* the status says enough */ }
    throw new Error(why);
  }
  return r.json();
}

// A refresh that changed nothing changes nothing on the page: open sections, search text and scroll stay as they are.
function accept(route, data) {
  if (data && data.frame) applyFrame(data.frame);
  const copy = Object.assign({}, data, { frame: Object.assign({}, data.frame, { checked: null }) });
  const sig = JSON.stringify(copy);
  if (S.sig[route] === sig) return false;
  S.sig[route] = sig;
  S.data[route] = data;
  return true;
}

async function load(route) {
  const changed = accept(route, await get(route));
  if (changed && S.place && ROUTE[S.place] === route) fill();
  if (changed && S.drawer && DRAWER_ROUTE[S.drawer.kind] === route) renderDrawer(false);
  return changed;
}

async function refresh() {
  if (S.busy || !S.place) return;
  S.busy = true;
  try {
    await load(ROUTE[S.place]);
    if (S.drawer && DRAWER_ROUTE[S.drawer.kind] !== ROUTE[S.place]) await load(DRAWER_ROUTE[S.drawer.kind]);
    S.err = null;
    $("checked").textContent = "Checked " + clock();
  } catch (e) {
    S.err = String(e && e.message || e);
    $("checked").textContent = "Could not check at " + clock();
  } finally {
    S.busy = false;
    renderProblems();
  }
}

// ---------------------------------------------------------------- the frame: the bar, and the problems banner
const mapKey = () => (S.frame && S.frame.word) || "map";

function applyFrame(f) {
  S.frame = f;
  const tab = $("tab-map");
  tab.textContent = f.name || "Map";
  tab.href = "#" + mapKey();
  const n = f.waiting || 0;
  $("count-waiting").textContent = n ? String(n) : "";
  $("tab-waiting").setAttribute("aria-label", n ? "Waiting, " + plural(n, "card") : "Waiting, nothing");
  renderGaming();
  renderProblems();
}

// The gaming indicator: what your inbox's "I'm gaming" button says, read from its flag as its gaming.py reads it. The
// page never writes the flag and never runs gaming.py. The hold lapses at its end time, between two reads too.
function hhmm(ms) {
  const d = new Date(ms);
  return Number.isNaN(d.getTime()) ? "?" : d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
function gamingWords(g, nowMs) {
  if (!g) return null;
  if (g.state === "on") {
    if (typeof g.until_epoch !== "number" || !(nowMs < g.until_epoch * 1000)) return null;
    return { text: "Gaming hold until " + hhmm(g.until_epoch * 1000), cls: "gaming",
      title: "Your inbox's I'm gaming button is on" + (g.since ? " since " + when(g.since) : "") + ". This page only reads it." };
  }
  if (g.state === "unknown") return { text: "Gaming state unknown", cls: "gaming unknown", title: g.why || "The gaming flag could not be read." };
  return null;
}
function renderGaming() {
  const node = $("gaming");
  // A server started before the page learned to read the flag sends no gaming state: then nothing is said.
  const w = S.frame ? gamingWords(S.frame.gaming, Date.now()) : null;
  node.hidden = !w;
  node.className = w ? w.cls : "gaming";
  node.textContent = w ? w.text : "";
  node.title = w ? w.title : "";
}

// The problems: on Waiting the cards lead, so the bar shows a quiet count that opens the list on a click; in the other
// places the list stays folded to its first line above the place, always in sight and never in the way.
function problemList() {
  const list = ((S.frame && S.frame.problems) || []).slice();
  if (S.err) list.unshift({ reader: "page", source: "", line: null, text: "The page could not read your files just now: " + S.err });
  return list;
}
function renderProblems() {
  const box = $("problems");
  const list = problemList();
  const onWaiting = S.place === "waiting" || !S.place;
  const count = $("problems-count");
  count.hidden = !(onWaiting && list.length);
  count.textContent = plural(list.length, "file problem");
  count.setAttribute("aria-expanded", String(Boolean(S.problemsOpen && list.length)));
  box.hidden = list.length === 0 || (onWaiting && !S.problemsOpen);
  if (!list.length) { box.replaceChildren(); return; }
  const item = (p) => h("li", null, h("span", null, cap(p.text || p.kind || "a problem")),
    h("span", { class: "pwhere" }, [p.source || "", p.line ? "line " + p.line : ""].filter(Boolean).join(", ")
      + (READER[p.reader] ? (p.source ? " · " : "") + READER[p.reader] : "")));
  const full = (into) => {
    into.append(h("ul", null, list.slice(0, 5).map(item)));
    if (list.length > 5) {
      const more = disclosure("problems:more", plural(list.length - 5, "more problem"));
      more.append(h("ul", null, list.slice(5).map(item)));
      into.append(more);
    }
  };
  if (onWaiting) {
    const title = h("p", { class: "problems-title" }, "Something in your files needs fixing:");
    box.replaceChildren(title);
    full(box);
  } else {
    const fold = disclosure("problems:show", h("span", null, h("span", { class: "problems-title" }, "Something in your files needs fixing: "),
      plural(list.length, "problem")), "problems-fold");
    full(fold);
    box.replaceChildren(fold);
  }
}

// ---------------------------------------------------------------- moving between places
function parseHash() {
  let raw = location.hash.replace(/^#/, "");
  try { raw = decodeURIComponent(raw); } catch (e) { /* a hash that is not encoding is read as it is */ }
  const cut = raw.indexOf("/");
  const head = cut < 0 ? raw : raw.slice(0, cut);
  const sub = cut < 0 ? null : raw.slice(cut + 1) || null;
  if (!head) return { place: "waiting", sub: null };
  if (head === "waiting" || head === "projects" || head === "documents" || head === "record") return { place: head, sub };
  if (head === "map" || (S.frame && S.frame.word && head === S.frame.word)) return { place: "map", sub };
  return { place: null, head, sub };
}

async function route() {
  let r = parseHash();
  if (!r.place && !S.frame) {
    try { accept("sources", await get("sources")); } catch (e) { S.err = String(e.message || e); }
    r = parseHash();
  }
  if (!r.place) r = { place: "waiting", sub: null };
  const key = r.place + "/" + (r.sub || "");
  const moved = key !== S.mounted;
  S.place = r.place;
  S.sub = r.sub;
  if (moved && S.target && (S.target.place !== r.place || r.place === "record")) S.target = null;
  for (const a of document.querySelectorAll(".places a")) {
    if (a.dataset.place === r.place) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  $("main").className = r.place === "projects" || r.place === "map" ? "wide" : "";
  if (moved) {
    S.mounted = key;
    mount();
    window.scrollTo(0, 0);
  }
  if (S.data[ROUTE[S.place]]) fill();
  try {
    await load(ROUTE[S.place]);
    S.err = null;
    $("checked").textContent = "Checked " + clock();
  } catch (e) {
    S.err = String(e.message || e);
    if (!S.data[ROUTE[S.place]]) fill();
  }
  renderProblems();
}

const MOUNT = { waiting: mountWaiting, projects: () => {}, documents: () => {}, map: () => {}, record: mountRecord };
const FILL = { waiting: fillWaiting, projects: fillProjects, documents: fillDocuments, map: fillMap, record: fillRecord };
function mount() { $("place").replaceChildren(); $("bar-place").replaceChildren(); MOUNT[S.place](); }
function fill() { keep(() => FILL[S.place]()); }

// Re-drawing keeps the scroll and, where it can, the focused control; only a link's target moves the page.
function keep(fn) {
  const y = window.scrollY;
  const a = document.activeElement;
  const k = a && a.dataset ? a.dataset.k : null;
  S.moved = false;
  fn();
  if (k && !document.contains(a)) {
    const again = document.querySelector('[data-k="' + CSS.escape(k) + '"]');
    if (again) again.focus({ preventScroll: true });
  }
  if (!S.moved && Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  S.moved = false;
}

function disclosure(key, summary, cls) {
  const d = h("details", { class: cls || null });
  d.open = S.open.has(key);
  d.append(summary instanceof Node ? h("summary", { "data-k": key }, summary) : h("summary", { "data-k": key }, summary));
  d.addEventListener("toggle", () => { if (d.open) S.open.add(key); else S.open.delete(key); });
  return d;
}

function header(title, sub, meta, crumbs) {
  return h("header", { class: "head" }, crumbs || null, h("h1", null, title), sub ? h("p", { class: "sub" }, sub) : null,
    meta ? h("p", { class: "meta" }, meta) : null);
}

function goCard(key) {
  S.target = { place: "waiting", key, focused: false };
  closeDrawer(true);
  if (S.q.waiting) { S.q.waiting = ""; if (W.search) W.search.value = ""; }
  if (location.hash === "#waiting") fill(); else location.hash = "#waiting";
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}

async function copyId(button) {
  const id = button.dataset.id;
  try {
    await navigator.clipboard.writeText(id);
    button.textContent = "Copied";
  } catch (e) {
    // If the clipboard is refused, the ID is selected so Ctrl+C copies it.
    const range = document.createRange();
    range.selectNodeContents(button);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    toast("Press Ctrl+C to copy " + id);
  }
  setTimeout(() => { button.textContent = id; }, 1500);
}

// ---------------------------------------------------------------- the card, as your inbox shows it
function chip(text, cls) { return h("span", { class: "chip " + cls }, text); }

function agentChip(name, id, k) {
  return h("button", { class: "chip seat", type: "button", "data-k": k || null, title: "Open " + name,
    on: { click: (ev) => openDrawer("agent", id ? { id } : { name }, ev.currentTarget) } }, name);
}

function runLine(run) {
  if (!run.finished) return h("p", { class: "status" }, "Started " + when(run.started) + ", and no result was recorded.");
  if (run.timed_out) return h("p", { class: "status bad" }, "Stopped after 30 minutes, " + when(run.finished) + ".");
  if (run.exit === 0) return h("p", { class: "status" }, "Ran " + when(run.finished) + ", and finished cleanly.");
  return h("p", { class: "status bad" }, "Ran " + when(run.finished) + ", and failed (exit " + (run.exit ?? "unknown") + ").");
}

function cardNode(c) {
  const waiting = c.state === "waiting", parked = c.state === "parked", done = c.state === "closed" || c.state === "run";
  const node = h("article", { class: "card " + (waiting ? "is-waiting" : parked ? "is-parked" : "is-done"), "data-card": c.key,
    "data-k": "card:" + c.key, tabindex: "-1" });
  const id = h("button", { class: "id", type: "button", title: "Copy this ID", "data-id": c.id, "data-k": "id:" + c.key,
    on: { click: (ev) => copyId(ev.currentTarget) } }, c.id);
  const at = h("time", { class: "at", datetime: c.at || null }, when(c.at));
  const kindWord = c.kind === "command" ? "Command" : c.kind === "change" ? (c.change && c.change.prune ? "Prune" : "Change") : "Decision";
  node.append(h("div", { class: "card-head" }, agentChip(c.seat, null, "seat:" + c.key), chip(kindWord, "kind"), id, at));
  node.append(h("h2", { class: "card-title" }, c.title), h("p", { class: "why" }, c.why));
  if (c.kind === "change" && c.change) {
    changeBody(c, node);
    // A change is a record, not an ask: the decision cards that ask about it are linked, and nothing runs from here.
    node.append(h("p", { class: "where" }, (c.asked_in || []).length
      ? ["Asked in ", c.asked_in.map((k, i) => [i ? ", " : "", h("button", { class: "link mono", type: "button", "data-k": "asked:" + c.key + ":" + k,
        on: { click: () => { S.open.add("shelf:done"); S.open.add("shelf:parked"); goCard(k); } } }, k.split("/").slice(1).join("/"))]), c.decided ? "; that card is closed, or an outcome is recorded (both are lines in the agent's own files)." : ". Nothing proposed runs before your word."]
      : "No decision card asks about it yet, so it waits for nothing."));
    for (const note of c.notes || []) node.append(h("p", { class: "refused" }, note));
    return node;
  } else if (c.kind === "command") {
    const facts = h("dl", { class: "facts" });
    if (c.does) facts.append(h("dt", null, "What it does"), h("dd", null, c.does));
    if (c.undo) facts.append(h("dt", null, "Undo"), h("dd", null, c.undo));
    if (c.cwd) facts.append(h("dt", null, "Runs in"), h("dd", { class: "mono" }, c.cwd));
    if (facts.childNodes.length) node.append(facts);
    node.append(h("pre", { class: "command" }, c.command || ""));
    if (c.run) node.append(runLine(c.run));
    const out = outputBox(c);
    if (out) node.append(out);
    if (!c.run && waiting) node.append(h("p", { class: "where", title: "This page never runs anything." }, "Run it or park it from your inbox."));
  } else {
    if (c.question) node.append(h("p", { class: "question" }, c.question));
    if (c.options && c.options.length) node.append(h("ol", { class: "options" }, c.options.map((o) => h("li", null, o))));
    if (c.change_id) {
      const target = c.seat + "/" + c.change_id;
      node.append(h("p", { class: "where" }, "It asks about the proposed change ", h("button", { class: "link mono", type: "button", "data-k": "about:" + c.key,
        on: { click: () => { S.open.add("shelf:changes"); goCard(target); } } }, c.change_id), "."));
    }
    if (waiting) node.append(h("p", { class: "where" }, "Answer in " + c.seat + "'s chat: paste the ID, then your decision. Park it from your inbox."));
  }
  for (const note of c.notes || []) node.append(h("p", { class: "refused" }, note));
  if (c.closing) node.append(h("p", { class: "closed" }, "Closed " + when(c.closing.at) + (c.closing.how ? ": " + c.closing.how : ".")));
  if (parked) node.append(h("p", { class: "park" }, "Parked " + when(c.parked_at) + ". " + c.seat + " holds it until you bring it back from your inbox."));
  node.append(cardMore(c));
  return node;
}

// A proposed change, as one card you can judge: what it changes and why, what it should move, what it risks, whether
// its evidence is still today's, and how to undo it. The undo is shown as data; this page never performs it.
const DIR = { up: "up", down: "down" };
function changeBody(c, node) {
  const ch = c.change;
  node.append(h("p", { class: "question" }, ch.hypothesis || ""));
  const facts = h("dl", { class: "facts" });
  const add = (k, v) => { if (v !== null && v !== undefined && v !== "") facts.append(h("dt", null, k), h("dd", null, v)); };
  add("Changes", ch.component);
  if (ch.predicted && ch.predicted.length) {
    add("Should move", h("ul", { class: "options" }, ch.predicted.map((p) => h("li", null, p.measure
      + (p.direction ? " " + DIR[p.direction] : "") + (p.p !== null && p.p !== undefined ? " (chance stated " + Math.round(p.p * 100) + "%)" : "")))));
  } else add("Should move", h("span", { class: "bad" }, "no measure named, so its effect cannot be checked"));
  add("Risk", ch.regression_risk);
  const w = ch.what_changes;
  if (w) {
    const parts = [w.added.length ? plural(w.added.length, "file") + " added" : null, w.removed.length ? plural(w.removed.length, "file") + " removed" : null,
      w.changed.length ? plural(w.changed.length, "file") + " changed" : null].filter(Boolean);
    add("What changes", (parts.join(", ") || "no file") + "; always-on text " + (w.always_on_char_delta > 0 ? "+" : w.always_on_char_delta < 0 ? "−" : "±")
      + Math.abs(w.always_on_char_delta) + " characters");
  }
  const f = ch.freshness;
  if (f) {
    add("Evidence", h("span", { class: f.state === "current" ? "soft" : "bad", title: f.why || (f.state === "stale" ? "Today's digest " + f.today + " is not the card's " + f.digest : "") },
      f.state === "current" ? "current: the files it was measured on are unchanged"
        : f.state === "stale" ? "stale: the files it was measured on have changed since"
          : "unknown: " + (f.why || "it cannot be checked")));
  }
  if (ch.undo) add("Undo", h("span", { class: "mono" }, ch.undo.commit ? "back to commit " + ch.undo.commit : "restore " + ch.undo.restore + (ch.undo.from ? " from " + ch.undo.from : "")));
  else add("Undo", h("span", { class: "bad" }, "none given"));
  node.append(facts);
  const more = disclosure("proposal:" + c.key, "How it was reasoned", "more");
  const dl = h("dl", { class: "facts" });
  for (const [k, v] of [["Trigger", ch.trigger], ["Why not smaller", ch.why_not_smaller], ["Retroactive check", ch.retroactive_check]]) if (v) dl.append(h("dt", null, k), h("dd", null, v));
  if (w) for (const [k, list] of [["Added", w.added], ["Removed", w.removed], ["Changed", w.changed]]) if (list.length) dl.append(h("dt", null, k), h("dd", { class: "mono" }, list.join(", ")));
  if (ch.evidence && ch.evidence.files.length) dl.append(h("dt", null, "Measured on"), h("dd", { class: "mono" }, ch.evidence.files.join(", ")));
  more.append(dl.childNodes.length ? dl : h("p", { class: "meta" }, "The card gives no more."));
  node.append(more);
  for (const o of c.outcomes || []) {
    node.append(h("p", { class: o.undone ? "status bad" : "status" }, (o.undone ? "Undone " : "Outcome recorded ") + when(o.at)
      + (Object.keys(o.moved || {}).length ? ": " + Object.entries(o.moved).map(([m, d]) => m + " " + d).join(", ") : "")
      + (o.regressions && o.regressions.length ? "; regressions: " + o.regressions.join("; ") : "") + "."));
  }
  const j = c.judged;
  if (j) {
    const hits = j.measures.filter((m) => m.hit === true).length, judged = j.measures.filter((m) => m.hit !== null).length;
    node.append(h("p", { class: "status" }, "Against its prediction: " + hits + " of " + plural(judged, "measured prediction") + " held"
      + (j.unpredicted_regressions.length ? "; " + plural(j.unpredicted_regressions.length, "regression") + " nobody predicted" : "") + "."));
  }
}

// A run's output, as your inbox shows it under Done: stdout and stderr as text, behind one click.
function outputBox(c) {
  const o = c.output;
  if (!o) return null;
  const out = String(o.stdout || "").trim(), err = String(o.stderr || "").trim();
  if (!out && !err) return null;
  const d = disclosure("output:" + c.key, "Output", "output");
  if (out) d.append(h("pre", { class: "command out" }, out));
  if (o.stdout_cut) d.append(h("p", { class: "meta" }, "and " + o.stdout_cut + " more characters of stdout, not shown here"));
  if (err) d.append(h("pre", { class: "command err" }, err));
  if (o.stderr_cut) d.append(h("p", { class: "meta" }, "and " + o.stderr_cut + " more characters of stderr, not shown here"));
  return d;
}

// What this page adds under a card, behind one click so the card stays as short as your inbox's: who asks and who
// acts, its project, and your earlier words. The line says how many earlier words there are, so they are never hidden
// without a sign.
function cardMore(c) {
  const n = (c.earlier || []).length;
  const d = disclosure("more:" + c.key, (n ? "Your earlier words (" + n + ") · " : "") + "Asks, acts" + (c.project ? ", project" : ""), "more");
  const who = h("p", { class: "who" },
    h("span", { class: "tip", title: "How the page knows: " + (c.asks_basis || "not said") }, "Asks: " + c.asks),
    "·", h("span", { class: "tip", title: "How the page knows: " + (c.acts_basis || "not said") }, "Acts: " + c.acts));
  if (c.project) {
    const why = c.project.via === "cwd" ? "it runs in this project's folder" : "its " + (c.project.field || "words") + " name this project's folder";
    who.append("·", h("a", { class: "chip", href: "#projects/" + encodeURIComponent(c.project.id), title: "In this project because " + why,
      "data-k": "proj:" + c.key }, c.project.name || "a project"));
  }
  const body = h("div", { class: "more-body" }, who);
  for (const e of c.earlier || []) {
    body.append(h("div", { class: "said" },
      h("p", { class: "meta" }, h("a", { href: "#record/" + encodeURIComponent(e.id), class: "mono" }, e.id),
        " · " + day(e.date) + " · " + (e.status || "no status") + " · " + e.link),
      h("blockquote", { class: "words" }, e.words || "(no words recorded)")));
  }
  d.append(body);
  return d;
}

// ---------------------------------------------------------------- Waiting
const W = {};

// On Waiting the cards lead: the place's heading, its sentence, the search and By project sit in the bar, so the first
// card is the first thing under it.
function mountWaiting() {
  W.head = h("div");
  W.say = h("span", { class: "say" });
  W.search = h("input", { class: "input search", type: "search", placeholder: "Search the cards", "aria-label": "Search the cards",
    value: S.q.waiting, "data-k": "search:waiting" });
  W.search.addEventListener("input", () => { S.q.waiting = W.search.value; fill(); });
  W.group = h("button", { class: "toggle small", type: "button", "aria-pressed": String(S.byProject), "data-k": "byproject" }, "By project");
  W.group.addEventListener("click", () => { S.byProject = !S.byProject; W.group.setAttribute("aria-pressed", String(S.byProject)); fill(); });
  W.tools = h("div", { class: "bar-tools", role: "group", "aria-label": "Waiting" }, W.say, W.search, W.group);
  $("bar-place").replaceChildren(W.tools);
  W.list = h("section", { class: "cards", "aria-label": "Waiting for you" });
  W.empty = h("div", { hidden: true });
  W.parked = h("div");
  W.done = h("div");
  $("place").replaceChildren(W.head, W.list, W.empty, W.parked, W.done);
}

function cardText(c) {
  const ch = c.change || {};
  return [c.id, c.seat, c.title, c.why, c.question, ...(c.options || []), c.command, c.does, c.undo, c.cwd,
    c.project && c.project.name, ch.component, ch.hypothesis, ch.trigger, ch.regression_risk,
    ...(ch.predicted || []).map((p) => p.measure)].filter(Boolean).join("\n").toLowerCase();
}

function fillWaiting() {
  const data = S.data.waiting;
  if (!data) { W.head.replaceChildren(h("h1", { class: "sr-only" }, "Waiting")); W.say.textContent = "Reading your files…"; return; }
  if (data.off) {
    W.head.replaceChildren(header("Waiting", "Waiting is off: your sources file names no " + listWords(data.missing.map((k) => '"' + k + '"')) + ".",
      S.frame ? "Your sources file: " + S.frame.config : null));
    W.tools.hidden = true;
    for (const x of [W.list, W.empty, W.parked, W.done]) x.replaceChildren();
    return;
  }
  W.tools.hidden = false;
  const q = S.q.waiting.trim().toLowerCase();
  const match = (c) => !q || cardText(c).includes(q);
  const all = newestFirst(data.cards);
  const waiting = all.filter((c) => c.state === "waiting");
  const parked = data.cards.filter((c) => c.state === "parked").sort((a, b) => stamp(b.parked_at) - stamp(a.parked_at));
  const done = all.filter((c) => c.state === "closed" || c.state === "run");
  const w = waiting.filter(match), p = parked.filter(match), d = done.filter(match);
  const sub = waiting.length === 0 ? "Nothing is waiting for you."
    : (waiting.length === 1 ? "1 card waits for your word." : waiting.length + " cards wait for your word, newest first.")
      + (q ? " " + w.length + " of them " + (w.length === 1 ? "matches" : "match") + "." : "");
  W.head.replaceChildren(h("h1", { class: "sr-only" }, "Waiting"));
  W.say.textContent = sub;
  W.say.title = data.seats.length ? "From the requests of " + listWords(data.seats) + "." : "No agent's requests are read.";

  if (S.byProject && w.length) {
    const groups = new Map();
    for (const c of w) {
      const k = c.project ? (c.project.name || c.project.id) : "";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(c);
    }
    const names = [...groups.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
    if (groups.has("")) names.push("");
    W.list.replaceChildren(...names.map((k) => h("div", null,
      h("h2", { class: "label group-head" }, (k || "Not in a project") + " · " + groups.get(k).length),
      h("div", { class: "cards" }, groups.get(k).map(cardNode)))));
  } else {
    W.list.replaceChildren(...w.map(cardNode));
  }
  W.empty.hidden = w.length !== 0;
  if (!waiting.length) {
    W.empty.replaceChildren(h("p", { class: "empty" }, "Nothing is waiting for you."), h("p", { class: "holds" }, data.holds ? data.holds.text : ""));
  } else if (!w.length) {
    W.empty.replaceChildren(h("p", { class: "empty" }, "No waiting card matches “" + S.q.waiting.trim() + "”."));
  }

  const parkedDecisions = data.record && !data.record.off ? data.record.parked : 0;
  W.parked.replaceChildren();
  if (parked.length || parkedDecisions) {
    const box = disclosure("shelf:parked", "Parked " + (q ? p.length + " of " + parked.length : parked.length), "shelf");
    if (box.open) {
      if (p.length) box.append(h("div", { class: "cards" }, p.map(cardNode)));
      if (parkedDecisions) box.append(h("p", { class: "shelf-note" }, plural(parkedDecisions, "decision is", "decisions are") + " parked in your register: ",
        h("a", { href: "#record", on: { click: () => { S.facet = "parked"; S.q.record = ""; } } }, "see them in the Record"), "."));
    }
    box.addEventListener("toggle", () => fill());
    W.parked.append(box);
  }
  W.done.replaceChildren();
  if (done.length) {
    const box = disclosure("shelf:done", "Done " + (q ? d.length + " of " + done.length : done.length), "shelf");
    if (box.open) box.append(h("div", { class: "cards" }, d.map(cardNode)));
    box.addEventListener("toggle", () => fill());
    W.done.append(box);
  }
  // Proposed changes: records, not asks, each linked to the decision cards that ask about it.
  const records = newestFirst(data.change_records || []);
  if (records.length) {
    const r = records.filter(match);
    const box = disclosure("shelf:changes", "Proposed changes " + (q ? r.length + " of " + records.length : records.length), "shelf");
    if (box.open) box.append(h("div", { class: "cards" }, r.map(cardNode)));
    box.addEventListener("toggle", () => fill());
    W.done.append(box);
  }
  // Proposed changes, per agent: filed, decided, and how their stated chances fared against what was measured.
  const scores = Object.entries(data.changes || {});
  if (scores.length) {
    W.done.append(h("p", { class: "shelf-note", style: "margin-top:20px" }, "Proposed changes: " + scores.map(([seat, s]) => seat + " " + s.filed + " filed, "
      + s.decided + " decided, " + (s.brier === null ? "no prediction scored yet" : "Brier " + s.brier.toFixed(2) + " over " + plural(s.scored, "prediction") + " (0 is perfect)")).join("; ") + "."));
  }
  applyTarget("waiting", "data-card");
}

// ---------------------------------------------------------------- Projects
function basisWords(m) {
  const basis = m.basis || [];
  const parts = [];
  if (basis.includes("home")) parts.push("its home");
  if (basis.includes("identity")) parts.push("listed in .identity" + (m.emails && m.emails.length ? " as " + m.emails.join(", ") : ""));
  return parts.join("; ") || "listed";
}

function gateCell(p, k) {
  const g = p.gates;
  if (!g.found) return h("span", { class: "none" }, "no gate read");
  if (!g.worktrees.length) return h("span", { class: "none" }, "no worktree found");
  const broken = BROKEN.has(g.worst);
  return h("button", { class: "cellbtn", type: "button", "data-k": k, title: "Open the gates",
    on: { click: (ev) => openDrawer("gates", { project: p.id }, ev.currentTarget) } },
    h("span", { class: "w" + (broken ? " bad" : "") }, g.worst + " (read)"),
    h("span", { class: "meta" }, g.broken ? g.broken + " of " + plural(g.worktrees.length, "worktree") : plural(g.worktrees.length, "worktree")));
}

function fillProjects() {
  const data = S.data.projects;
  const place = $("place");
  if (!data) { place.replaceChildren(header("Projects", "Reading your files…")); return; }
  if (S.sub) return fillProject(data, S.sub);
  if (data.off) {

  }

  const sub = plural(rows.length, "project") + " from your seats file, with " + plural(data.worktrees, "worktree")
    + ". " + data.assigned + " of " + plural(data.total, "card") + " belong to one.";
