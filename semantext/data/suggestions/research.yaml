environment:
  id: research
  version: 0.1.0
  title: Research and study
  scope: Suggested when an environment is for finding things out or learning.
  keywords: [research, study, studying, learn, learning, school, college, university, exam, science, reading, thesis]
entries:
- id: research.source-or-test
  kind: rule
  statement: Every claim carries a source or a test that could have failed. Otherwise call it a guess.
  applies_when: Always, in this environment.
  mode: stationary
- id: research.say-what-was-not-checked
  kind: rule
  statement: Say what was not searched or not checked, beside every finding.
  applies_when: A finding is reported.
  mode: stationary
- id: research.predict-first
  kind: rule
  statement: Write the prediction down before running the test, so the result cannot bend it.
  applies_when: An experiment or a search is about to run.
  mode: stationary
- id: research.explain-like-new
  kind: rule
  statement: When I am learning something new, explain it from the ground up, one step at a time.
  applies_when: I say I am new to a topic, or ask what something means.
  mode: adaptive
